<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Listão Geral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">📊 Listão & Telegram</h1>
        <button onclick="window.history.back()" class="text-sm font-bold text-gray-600 hover:text-red-700 cursor-pointer">&larr; Voltar</button>
    </nav>

    <main class="max-w-4xl mx-auto p-6 mt-4 space-y-6">
        
        <div class="bg-white rounded-xl p-6 shadow-sm border border-blue-200">
            <h2 class="text-lg font-black text-blue-900 mb-2">✨ Gerar Listão Atualizado</h2>
            <p class="text-xs text-gray-500 mb-6">Clique no botão abaixo para o sistema varrer todas as obras cadastradas e montar o texto organizado por status.</p>
            
            <button id="btn-gerar" onclick="gerarListao()" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-black py-4 rounded-xl text-lg shadow-md cursor-pointer transition flex justify-center items-center gap-2">
                🚀 Gerar Listão Completo
            </button>
        </div>

        <div id="area-resultado" class="hidden bg-white rounded-xl p-6 shadow-sm border border-gray-200">
            <h3 class="text-lg font-black text-gray-800 border-b border-gray-100 pb-2 mb-4">📝 Texto para Copiar</h3>
            <div class="relative">
                <textarea id="texto-listao" rows="15" class="w-full bg-blue-50 border border-blue-200 rounded-lg px-4 py-3 text-sm font-mono text-gray-800 focus:outline-none mb-4" readonly></textarea>
            </div>
            <button onclick="copiarTextoListao()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg text-sm shadow cursor-pointer transition mb-2">
                📋 Copiar Texto do Listão
            </button>
        </div>

        <div id="area-capas" class="hidden bg-white rounded-xl p-6 shadow-sm border border-gray-200">
            <h3 class="text-lg font-black text-gray-800 border-b border-gray-100 pb-2 mb-4">🖼️ Capas das Obras</h3>
            <div id="grid-capas" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = () => { if(!localStorage.getItem('usuario_nick')) window.location.href = 'index.html'; };

        async function gerarListao() {
            const btn = document.getElementById('btn-gerar');
            btn.innerHTML = '⏳ Buscando obras no sistema...';
            btn.disabled = true;

            try {
                const { data: obras, error } = await _supabase.from('obras').select('*').order('nome', { ascending: true });
                if (error) throw error;
                if (!obras || obras.length === 0) { alert("Nenhuma obra encontrada."); return; }

                const ativas = obras.filter(o => o.status === 'Ativa');
                const pausadas = obras.filter(o => o.status === 'Pausada');
                const finalizadas = obras.filter(o => o.status === 'Finalizada');

                let texto = "✨ NOSSO LISTÃO DE OBRAS ✨\n\n";

                // ADICIONADO ESPAÇO ENTRE AS OBRAS COMO SOLICITADO
                if (ativas.length > 0) {
                    texto += "🟢 EM ANDAMENTO:\n\n";
                    ativas.forEach(o => {
                        let plat = o.plataforma_oficial && o.plataforma_oficial !== 'Outra' ? ` (${o.plataforma_oficial})` : '';
                        texto += `~ ${o.nome}${plat}\n\n`; 
                    });
                }
                if (pausadas.length > 0) {
                    texto += "🟡 PAUSADAS / EM HIATO:\n\n";
                    pausadas.forEach(o => { texto += `~ ${o.nome}\n\n`; });
                }
                if (finalizadas.length > 0) {
                    texto += "🔴 FINALIZADAS:\n\n";
                    finalizadas.forEach(o => { texto += `~ ${o.nome}\n\n`; });
                }

                texto += ".\n.\n.\n🔗• Link: fbsquadx.com\n\n‼️ Copiem o link e colem no navegador do celular de vocês ‼️";
                
                document.getElementById('texto-listao').value = texto;
                document.getElementById('area-resultado').classList.remove('hidden');

                let htmlCapas = "";
                obras.forEach(obra => {
                    if(obra.capa_url) {
                        htmlCapas += `
                            <div class="relative rounded-lg overflow-hidden border border-gray-200 shadow-sm flex flex-col">
                                <img src="${obra.capa_url}" class="w-full h-40 object-cover rounded-t-lg">
                                <div class="bg-gray-900 text-white text-[10px] p-1 text-center truncate">${obra.nome}</div>
                                <button onclick="baixarImagem('${obra.capa_url}', 'Capa_${obra.nome.replace(/\s+/g, '_')}.png')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 text-xs font-bold py-2 w-full rounded-b-lg transition cursor-pointer">⬇️ Baixar Capa</button>
                            </div>`;
                    }
                });

                document.getElementById('grid-capas').innerHTML = htmlCapas || "<p class='text-xs text-red-500'>Nenhuma capa cadastrada.</p>";
                document.getElementById('area-capas').classList.remove('hidden');
            } catch (err) { alert("Erro ao gerar listão: " + err.message); }

            btn.innerHTML = '🚀 Gerar Listão Completo'; btn.disabled = false;
        }

        function copiarTextoListao() {
            const textoArea = document.getElementById("texto-listao");
            textoArea.select(); textoArea.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(textoArea.value).then(() => alert("Listão copiado com sucesso! 📋✨")).catch(() => alert("Seu navegador bloqueou a cópia. Copie manualmente."));
        }

        async function baixarImagem(url, nomeArquivo) {
            try {
                const response = await fetch(url); const blob = await response.blob();
                const linkUrl = window.URL.createObjectURL(blob);
                const link = document.createElement('a'); link.href = linkUrl; link.download = nomeArquivo;
                document.body.appendChild(link); link.click(); document.body.removeChild(link); window.URL.revokeObjectURL(linkUrl);
            } catch (err) { window.open(url, '_blank'); }
        }
    </script>
</body>
</html>
