<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - O Listão Geral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <h1 class="text-xl font-bold text-gray-800">📊 O Listão Geral</h1>
        <button onclick="window.location.href='dashboard-moderador.html'" class="text-sm font-bold text-gray-600 hover:text-red-700 cursor-pointer">&larr; Voltar</button>
    </nav>

    <main class="max-w-5xl mx-auto p-6 mt-4 space-y-6">
        
        <!-- FORMULÁRIO DO LISTÃO -->
        <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
            <h2 class="text-lg font-black text-gray-900 mb-4 flex items-center gap-2">✍️ Lançar no Listão</h2>
            
            <form id="form-listao" onsubmit="salvarNoListao(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-6 gap-4 items-end">
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Data (Referência)</label>
                    <input type="date" id="listao-data" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Obra</label>
                    <select id="listao-obra" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="">Carregando obras...</option>
                    </select>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Tipo</label>
                    <select id="listao-tipo" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="Recorrente">Recorrente</option>
                        <option value="Curta">Curta</option>
                        <option value="Nova Obra">Nova Obra</option>
                        <option value="Finalização">Finalização</option>
                    </select>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Capítulos</label>
                    <input type="text" id="listao-caps" placeholder="Ex: 10 ao 12" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div class="md:col-span-1">
                    <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-2 px-4 rounded-lg text-sm shadow cursor-pointer">
                        + Adicionar
                    </button>
                </div>
            </form>
        </div>

        <!-- PROGRAMAÇÃO ATUAL -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <h3 class="text-lg font-black text-gray-800 flex items-center gap-2">📋 Programação Atual</h3>
                
                <div class="flex gap-2">
                    <button id="btn-limpar-listao" onclick="limparListao()" class="hidden bg-red-100 hover:bg-red-200 text-red-700 text-sm font-bold py-2 px-4 rounded-lg cursor-pointer">
                        🗑️ Limpar Tudo
                    </button>
                    <!-- BOTÃO DO TELEGRAM (Apenas ADM) -->
                    <button id="btn-gerar-telegram-listao" onclick="gerarTelegramListao()" class="hidden bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 px-4 rounded-lg shadow-md cursor-pointer flex items-center gap-2">
                        📲 Gerar Telegram
                    </button>
                </div>
            </div>

            <!-- ÁREA DO GERADOR DO TELEGRAM (Oculta por padrão) -->
            <div id="area-telegram-listao" class="hidden p-6 bg-blue-50 border-b border-blue-100">
                <h4 class="text-md font-black text-blue-800 mb-2">Mensagem do Cronograma:</h4>
                <textarea id="texto-telegram-listao" rows="12" class="w-full bg-white border border-blue-200 rounded-lg px-3 py-2 text-sm font-mono text-gray-800 focus:outline-none" readonly></textarea>
                <button onclick="document.getElementById('area-telegram-listao').classList.add('hidden')" class="mt-2 text-xs font-bold text-gray-500 hover:text-gray-700 cursor-pointer">Fechar Janela</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-xs uppercase font-black text-gray-700">
                        <tr>
                            <th class="px-6 py-3">Data</th>
                            <th class="px-6 py-3">Obra</th>
                            <th class="px-6 py-3">Tipo</th>
                            <th class="px-6 py-3">Capítulos</th>
                            <th class="px-6 py-3">Resp.</th>
                            <th class="px-6 py-3 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-listao" class="divide-y divide-gray-100">
                        <tr><td colspan="6" class="px-6 py-4 text-center text-gray-400">Carregando programação...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let dadosListao = [];

        window.onload = async () => {
            const cargo = localStorage.getItem('usuario_cargo');
            if (cargo === 'Administrador') {
                document.getElementById('btn-gerar-telegram-listao').classList.remove('hidden');
                document.getElementById('btn-limpar-listao').classList.remove('hidden');
            }

            // Se a pessoa esqueceu de colocar o RLS desligado, avisa!
            carregarObrasSelect();
            carregarListao();
        };

        async function carregarObrasSelect() {
            const { data } = await _supabase.from('obras').select('nome').order('nome');
            const select = document.getElementById('listao-obra');
            select.innerHTML = '<option value="">Selecione a Obra...</option>';
            if(data) data.forEach(o => select.innerHTML += `<option value="${o.nome}">${o.nome}</option>`);
        }

        // Função mágica para converter "YYYY-MM-DD" em data legível
        function formatarData(dataIso) {
            if(!dataIso) return { display: 'Sem data', diaSemana: 'Desconhecido', stringBusca: '0' };
            
            // O JavaScript buga fuso horário às vezes, então quebramos a string
            const partes = dataIso.split('-'); 
            const ano = parseInt(partes[0]);
            const mes = parseInt(partes[1]) - 1; // Mês começa em 0 no JS
            const dia = parseInt(partes[2]);
            
            const dataObj = new Date(ano, mes, dia);
            const diasSemana = ['DOMINGO', 'SEGUNDA-FEIRA', 'TERÇA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SÁBADO'];
            
            const diaFormatado = String(dia).padStart(2, '0');
            const mesFormatado = String(mes + 1).padStart(2, '0');

            return {
                dataCurta: `${diaFormatado}/${mesFormatado}`,
                diaSemana: diasSemana[dataObj.getDay()],
                original: dataIso // para ordenar
            };
        }

        async function salvarNoListao(event) {
            event.preventDefault();
            
            const obj = {
                data_referencia: document.getElementById('listao-data').value,
                obra_nome: document.getElementById('listao-obra').value,
                tipo_obra: document.getElementById('listao-tipo').value,
                capitulos: document.getElementById('listao-caps').value,
                responsavel_nick: localStorage.getItem('usuario_nick') || 'Desconhecido'
            };

            const { error } = await _supabase.from('listao_preenchimento').insert([obj]);

            if (error) {
                alert('Erro ao adicionar: ' + error.message);
            } else {
                document.getElementById('listao-caps').value = '';
                carregarListao();
            }
        }

        async function carregarListao() {
            const { data, error } = await _supabase.from('listao_preenchimento').select('*');
            const tbody = document.getElementById('tabela-listao');
            
            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-4 text-center text-red-500">Erro: ${error.message} (Verifique se o RLS está desligado nesta tabela!)</td></tr>`;
                return;
            }

            dadosListao = data || [];
            tbody.innerHTML = '';

            if (dadosListao.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-4 text-center text-gray-400">Nenhuma obra no listão.</td></tr>`;
                return;
            }

            // Ordenar por data cronológica
            dadosListao.sort((a, b) => new Date(a.data_referencia) - new Date(b.data_referencia));

            dadosListao.forEach(item => {
                const infoData = formatarData(item.data_referencia);
                
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b border-gray-100 last:border-0">
                        <td class="px-6 py-3 font-bold text-gray-800">
                            ${infoData.dataCurta}
                            <span class="block text-[10px] text-gray-400 font-normal uppercase">${infoData.diaSemana}</span>
                        </td>
                        <td class="px-6 py-3 text-gray-800 font-semibold">${item.obra_nome}</td>
                        <td class="px-6 py-3"><span class="bg-gray-200 text-gray-700 text-xs px-2 py-1 rounded">${item.tipo_obra}</span></td>
                        <td class="px-6 py-3 text-red-700 font-bold">${item.capitulos}</td>
                        <td class="px-6 py-3 text-gray-500 text-xs">${item.responsavel_nick}</td>
                        <td class="px-6 py-3 text-right">
                            <button onclick="removerDoListao('${item.id}')" class="text-red-500 hover:text-red-700 font-bold text-xs bg-red-50 px-2 py-1 rounded cursor-pointer">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function removerDoListao(id) {
            if(confirm('Tem certeza que deseja remover esta obra do listão?')) {
                await _supabase.from('listao_preenchimento').delete().eq('id', id);
                carregarListao();
            }
        }

        async function limparListao() {
            if(confirm('ALERTA: Isso vai APAGAR O LISTÃO INTEIRO do banco de dados. Tem certeza?')) {
                await _supabase.from('listao_preenchimento').delete().neq('id', '0'); // Deleta tudo
                carregarListao();
            }
        }

        function gerarTelegramListao() {
            if(dadosListao.length === 0) {
                alert("O listão está vazio!");
                return;
            }

            const container = document.getElementById('area-telegram-listao');
            const textarea = document.getElementById('texto-telegram-listao');
            container.classList.remove('hidden');

            // Agrupar obras pela mesma data (Ex: "2023-10-25")
            const cronograma = {};
            
            dadosListao.forEach(item => {
                if(!item.data_referencia) return;
                
                if(!cronograma[item.data_referencia]) {
                    cronograma[item.data_referencia] = [];
                }
                cronograma[item.data_referencia].push(`~ ${item.obra_nome} • ${item.capitulos}`);
            });

            // Pegar as chaves de datas e ordenar
            const datasOrdenadas = Object.keys(cronograma).sort((a, b) => new Date(a) - new Date(b));

            let textoFinal = "🗓️ PROGRAMAÇÃO DA SEMANA 🗓️\n\n";

            datasOrdenadas.forEach(dataIso => {
                const info = formatarData(dataIso);
                textoFinal += `✨ ${info.diaSemana} (${info.dataCurta})\n`;
                
                cronograma[dataIso].forEach(linha => {
                    textoFinal += `${linha}\n`;
                });
                textoFinal += `\n`;
            });

            textoFinal += `.\n.\n.\n🔗• Link: fbsquadx.com`;
            textarea.value = textoFinal;
        }
    </script>
</body>
</html>
