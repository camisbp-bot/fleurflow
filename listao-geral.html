<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - O Listão Geral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <h1 class="text-xl font-bold text-gray-800">📊 O Listão Geral</h1>
        <button id="btn-voltar" class="text-sm font-bold text-gray-600 hover:text-red-700 cursor-pointer">&larr; Voltar</button>
    </nav>

    <main class="max-w-6xl mx-auto p-6 mt-4 space-y-6">
        
        <!-- PAINEL ADM: DATAS -->
        <div id="painel-adm-datas" class="hidden bg-red-50 rounded-xl p-6 shadow-sm border border-red-200">
            <h2 class="text-lg font-black text-red-900 mb-2">👑 Painel ADM: Liberar Datas</h2>
            <form onsubmit="liberarData(event)" class="flex gap-4 items-end mb-4">
                <div><input type="date" id="nova-data-adm" required class="w-full bg-white border border-red-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500"></div>
                <div><button type="submit" class="bg-red-700 hover:bg-red-800 text-white font-bold py-2 px-6 rounded-lg text-sm shadow cursor-pointer">Liberar</button></div>
            </form>
            <div id="lista-datas-liberadas" class="flex flex-wrap gap-2 text-sm pt-3 border-t border-red-200"></div>
        </div>

        <!-- FORMULÁRIO DO LISTÃO -->
        <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
            <h2 class="text-lg font-black text-gray-900 mb-4">✍️ Lançar no Listão</h2>
            <form id="form-listao" onsubmit="salvarNoListao(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 items-end">
                
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Data Liberada</label>
                    <select id="listao-data" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm"><option value="">Aguarde...</option></select>
                </div>
                
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Obra</label>
                    <select id="listao-obra" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm"><option value="">Carregando...</option></select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Capítulos</label>
                    <input type="text" id="listao-caps" placeholder="Ex: 10 ao 12" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Classificação da Obra</label>
                    <select id="listao-classificacao" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="Recorrente">Recorrente</option>
                        <option value="Curtas">Curtas</option>
                        <option value="Combos">Combos</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Tipo de Postagem</label>
                    <select id="listao-postagem" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="Atualização">Atualização</option>
                        <option value="Finalização">Finalização</option>
                        <option value="Lançamento">Lançamento</option>
                        <option value="Lançamento e Finalização">Lançamento e Finalização</option>
                    </select>
                </div>

                <!-- CAMPO NOVO DE TAGS SELECIONÁVEIS -->
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Observação / Tag</label>
                    <select id="listao-obs" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="">Sem Tag (Deixar em branco)</option>
                        <option value="DESCENSURA OFICIAL">DESCENSURA OFICIAL</option>
                        <option value="DESCENSURA FLEUR">DESCENSURA FLEUR</option>
                    </select>
                </div>

                <div class="md:col-span-4">
                    <label class="block text-xs font-bold text-gray-700 mb-1">👥 Responsável(is) pela Postagem</label>
                    <div id="listao-responsaveis" class="grid grid-cols-2 sm:grid-cols-4 gap-2 p-3 bg-gray-50 rounded-lg border border-gray-300 max-h-40 overflow-y-auto">
                        <p class="text-xs text-gray-500">Carregando equipe...</p>
                    </div>
                </div>

                <div class="md:col-span-4">
                    <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3 rounded-lg text-sm shadow cursor-pointer">+ Adicionar à Programação</button>
                </div>
            </form>
        </div>

        <!-- PROGRAMAÇÃO ATUAL -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center gap-4">
                <h3 class="text-lg font-black text-gray-800 flex items-center gap-2">📋 Programação Atual</h3>
                <div class="flex gap-2">
                    <button id="btn-limpar-listao" onclick="limparListao()" class="hidden bg-red-100 text-red-700 text-sm font-bold py-2 px-4 rounded-lg cursor-pointer">🗑️ Limpar Tudo</button>
                    <button id="btn-gerar-telegram-listao" onclick="gerarTelegramListao()" class="hidden bg-blue-600 text-white text-sm font-bold py-2 px-4 rounded-lg shadow-md cursor-pointer">📲 Gerar Telegram</button>
                </div>
            </div>

            <div id="area-telegram-listao" class="hidden p-6 bg-blue-50 border-b border-blue-100">
                <textarea id="texto-telegram-listao" rows="15" class="w-full bg-white border border-blue-200 rounded-lg px-3 py-2 text-sm font-mono text-gray-800" readonly></textarea>
                <button onclick="document.getElementById('area-telegram-listao').classList.add('hidden')" class="mt-2 text-xs font-bold text-gray-500">Fechar</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-xs uppercase font-black text-gray-700">
                        <tr>
                            <th class="px-4 py-3">Data</th>
                            <th class="px-4 py-3">Obra</th>
                            <th class="px-4 py-3">Postagem</th>
                            <th class="px-4 py-3">Caps</th>
                            <th class="px-4 py-3">Resp.</th>
                            <th class="px-4 py-3 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-listao" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let dadosListao = [];

        window.onload = async () => {
            const cargo = localStorage.getItem('usuario_cargo');
            
            document.getElementById('btn-voltar').onclick = () => {
                window.location.href = cargo === 'Administrador' ? 'dashboard-adm.html' : 'dashboard-moderador.html';
            };

            if (cargo === 'Administrador') {
                document.getElementById('painel-adm-datas').classList.remove('hidden');
                document.getElementById('btn-gerar-telegram-listao').classList.remove('hidden');
                document.getElementById('btn-limpar-listao').classList.remove('hidden');
            }

            carregarObrasSelect();
            carregarDatasLiberadas();
            carregarEquipe();
            carregarListao();
        };

        function formatarData(dataIso) {
            if(!dataIso) return { display: 'Sem data', diaSemana: 'Desconhecido', dataCurta: '--/--' };
            const partes = dataIso.split('-'); 
            const dataObj = new Date(partes[0], partes[1] - 1, partes[2]);
            const dias = ['DOMINGO', 'SEGUNDA-FEIRA', 'TERÇA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SÁBADO'];
            return {
                dataCurta: `${String(partes[2]).padStart(2, '0')}/${String(partes[1]).padStart(2, '0')}`,
                diaSemana: dias[dataObj.getDay()]
            };
        }

        async function carregarEquipe() {
            const { data } = await _supabase.from('equipe').select('nick').order('nick');
            const container = document.getElementById('listao-responsaveis');
            container.innerHTML = '';
            const meuNick = localStorage.getItem('usuario_nick');
            
            if(data) {
                data.forEach(m => {
                    const marcado = (m.nick === meuNick) ? 'checked' : '';
                    container.innerHTML += `
                        <label class="flex items-center gap-2 text-xs font-semibold text-gray-700 cursor-pointer p-1 hover:bg-gray-100 rounded">
                            <input type="checkbox" name="resp_listao" value="${m.nick}" class="rounded text-red-700" ${marcado}> ${m.nick}
                        </label>
                    `;
                });
            } else {
                container.innerHTML = '<p class="text-xs text-red-500">Erro ao carregar equipe.</p>';
            }
        }

       async function liberarData(e) {
            e.preventDefault();
            const { error } = await _supabase.from('listao_config').insert([{ data_listao: document.getElementById('nova-data-adm').value }]);
            
            if (error) {
                alert('🚨 Erro do Supabase: ' + error.message);
                console.error(error);
            } else { 
                document.getElementById('nova-data-adm').value = ''; 
                carregarDatasLiberadas(); 
                alert('Data liberada com sucesso!');
            }
        }

        async function fecharData(id) {
            if(confirm('Remover data?')) { await _supabase.from('listao_config').delete().eq('id', id); carregarDatasLiberadas(); }
        }

        async function carregarDatasLiberadas() {
            const { data } = await _supabase.from('listao_config').select('*').order('data_listao', { ascending: true });
            const tags = document.getElementById('lista-datas-liberadas');
            const select = document.getElementById('listao-data');
            tags.innerHTML = ''; select.innerHTML = '<option value="">Selecione a data...</option>';
            if(data) data.forEach(i => {
                const info = formatarData(i.data_listao);
                const disp = `${info.dataCurta} - ${info.diaSemana}`;
                tags.innerHTML += `<div class="bg-white border border-red-200 px-3 py-1 rounded-full"><span class="font-bold text-red-900">${disp}</span> <button onclick="fecharData('${i.id}')" class="text-red-500 font-bold ml-2">X</button></div>`;
                select.innerHTML += `<option value="${i.data_listao}">${disp}</option>`;
            });
        }

        async function carregarObrasSelect() {
            const { data } = await _supabase.from('obras').select('nome').order('nome');
            const sel = document.getElementById('listao-obra');
            if(data) data.forEach(o => sel.innerHTML += `<option value="${o.nome}">${o.nome}</option>`);
        }

        async function salvarNoListao(e) {
            e.preventDefault();
            
            const checkboxes = document.querySelectorAll('input[name="resp_listao"]:checked');
            const responsaveisSelecionados = Array.from(checkboxes).map(cb => cb.value).join(', ');

            if(!responsaveisSelecionados) {
                alert("Por favor, marque pelo menos um responsável!");
                return;
            }

            const obj = {
                data_referencia: document.getElementById('listao-data').value,
                obra_nome: document.getElementById('listao-obra').value,
                capitulos: document.getElementById('listao-caps').value,
                classificacao_obra: document.getElementById('listao-classificacao').value,
                tipo_postagem: document.getElementById('listao-postagem').value,
                observacao_telegram: document.getElementById('listao-obs').value, // Pega da nova caixinha
                responsavel_nick: responsaveisSelecionados
            };
            const { error } = await _supabase.from('listao_preenchimento').insert([obj]);
            if (!error) { 
                document.getElementById('listao-caps').value = '';
                document.getElementById('listao-obs').value = '';
                carregarListao(); 
            }
            else alert('Erro: ' + error.message);
        }

        async function carregarListao() {
            const { data } = await _supabase.from('listao_preenchimento').select('*');
            const tb = document.getElementById('tabela-listao');
            dadosListao = data || []; tb.innerHTML = '';
            dadosListao.sort((a, b) => new Date(a.data_referencia) - new Date(b.data_referencia));
            dadosListao.forEach(i => {
                const info = formatarData(i.data_referencia);
                const obsTag = i.observacao_telegram ? `<br><span class="text-[10px] text-blue-600 font-bold uppercase">${i.observacao_telegram}</span>` : '';
                tb.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b">
                        <td class="px-4 py-3 font-bold">${info.dataCurta}</td>
                        <td class="px-4 py-3 font-semibold text-gray-800">${i.obra_nome} <span class="text-[10px] text-gray-400">(${i.classificacao_obra})</span>${obsTag}</td>
                        <td class="px-4 py-3 text-xs bg-gray-100 rounded">${i.tipo_postagem}</td>
                        <td class="px-4 py-3 text-red-700 font-bold">${i.capitulos}</td>
                        <td class="px-4 py-3 text-xs text-gray-500">${i.responsavel_nick}</td>
                        <td class="px-4 py-3 text-right"><button onclick="remover('${i.id}')" class="text-red-500 font-bold text-xs">Excluir</button></td>
                    </tr>`;
            });
        }

        async function remover(id) { if(confirm('Remover?')) { await _supabase.from('listao_preenchimento').delete().eq('id', id); carregarListao(); } }
        async function limparListao() { if(confirm('APAGAR TUDO?')) { await _supabase.from('listao_preenchimento').delete().neq('id', '0'); carregarListao(); } }

        function gerarTelegramListao() {
            if(dadosListao.length === 0) return alert("Listão vazio!");
            document.getElementById('area-telegram-listao').classList.remove('hidden');
            
            const cronograma = {};
            dadosListao.forEach(i => {
                if(!i.data_referencia) return;
                if(!cronograma[i.data_referencia]) cronograma[i.data_referencia] = [];
                cronograma[i.data_referencia].push(i);
            });

            let texto = "🗓️ PROGRAMAÇÃO DA SEMANA 🗓️\n\n";
            Object.keys(cronograma).sort((a, b) => new Date(a) - new Date(b)).forEach(dataIso => {
                const info = formatarData(dataIso);
                texto += `📅 ${info.diaSemana} (${info.dataCurta})\n\n`;

                const obrasDia = cronograma[dataIso];
                const cats = { "Lançamento": [], "Lançamento e Finalização": [], "Atualização": [], "Finalização": [] };
                obrasDia.forEach(o => { if(cats[o.tipo_postagem]) cats[o.tipo_postagem].push(o); });

                ["Lançamento", "Lançamento e Finalização", "Atualização", "Finalização"].forEach(cat => {
                    if(cats[cat].length > 0) {
                        texto += `✨ ${cat.toUpperCase().replace(" E ", " & ")}\n\n`;
                        cats[cat].forEach(ob => {
                            let linha = `~ ${ob.obra_nome} • ${ob.capitulos}`;
                            if(ob.observacao_telegram) linha += ` — ${ob.observacao_telegram}`;
                            texto += `${linha}\n`;
                        });
                        texto += `\n`;
                    }
                });
                texto += `========================\n\n`;
            });

            texto += `.\n.\n.\n🔗• Link: fbsquadx.com\n\n‼️ Copiem o link e colem no navegador do celular de vocês ‼️`;
            document.getElementById('texto-telegram-listao').value = texto;
        }
    </script>
</body>
</html>
