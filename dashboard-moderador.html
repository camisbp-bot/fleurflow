<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Painel Moderador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <img src="MARCA.png" alt="Logo Fleur" class="h-10 object-contain">
            <h1 class="text-xl font-bold text-gray-800 border-l border-gray-300 pl-4">Painel Moderador</h1>
        </div>
        <div>
            <button onclick="sair()" class="text-sm font-bold text-red-600 hover:text-red-800 transition">Sair</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 mt-4 space-y-6">
        
        <!-- ATALHOS PRINCIPAIS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Lista de Atualização Diária -->
            <div onclick="window.location.href='central-atualizacoes.html'" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 cursor-pointer hover:border-red-500 transition flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold text-gray-800">📅 Lista de Atualização Diária</h3>
                    <p class="text-sm text-gray-600 mt-1">Acompanhe e modere as atualizações das equipes.</p>
                </div>
                <span class="text-2xl">&rarr;</span>
            </div>

            <!-- O Listão -->
            <div onclick="window.location.href='listao.html'" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 cursor-pointer hover:border-red-500 transition flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold text-gray-800">📊 O Listão Geral</h3>
                    <p class="text-sm text-gray-600 mt-1">Visualização geral de todas as obras do sistema.</p>
                </div>
                <span class="text-2xl">&rarr;</span>
            </div>
        </div>

        <!-- SEÇÃO DE MODERAÇÃO -->
        <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-100 pb-2">🛡️ Painel de Moderação</h3>
            <div id="painel-moderacao" class="text-gray-600 text-sm">
                Carregando painel...
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI';
        const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY_AQUI';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function sair() {
            window.location.href = 'index.html';
        }

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                document.getElementById('painel-moderacao').innerHTML = '<p class="text-gray-500">Nenhuma pendência de moderação no momento.</p>';
            } catch (err) {
                console.error("Erro:", err);
            }
        });
    </script>
</body>
</html>
