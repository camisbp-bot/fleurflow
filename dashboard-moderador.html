<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Painel do Moderador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-10">

    <nav class="bg-white px-6 py-4 flex justify-between items-center shadow-sm border-b border-gray-200 sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-black text-gray-800 tracking-tight">FleurFlow <span class="text-gray-400 text-sm font-normal">| Painel do Moderador</span></h1>
        </div>
        <div>
            <button onclick="sair()" class="text-red-700 hover:text-red-900 text-sm font-bold transition cursor-pointer">Sair</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6 mt-6 space-y-8">
        
        <div class="mb-6">
            <h2 id="saudacao" class="text-2xl font-black text-gray-900">Olá, Moderador!</h2>
            <p class="text-gray-600 text-sm">Selecione uma das opções abaixo para gerenciar a scan.</p>
        </div>

        <!-- MENU DE BOTÕES -->
        <div class="space-y-4">
            
            <button onclick="window.location.href='cadastro-obra.html'" class="w-full bg-red-700 hover:bg-red-800 text-left p-6 rounded-xl flex justify-between items-center transition shadow-md cursor-pointer group">
                <div>
                    <h3 class="text-white font-black text-lg flex items-center gap-2">➕ Cadastrar Nova Obra / Editar</h3>
                    <p class="text-red-100 text-xs mt-1">Adicione novos projetos, links, imagens e vincule a staff.</p>
                </div>
                <span class="text-white opacity-50 group-hover:opacity-100 transition text-xl">&rarr;</span>
            </button>

            <button onclick="window.location.href='central-atualizacoes.html'" class="w-full bg-white border border-gray-200 hover:border-gray-300 hover:shadow-sm text-left p-6 rounded-xl flex justify-between items-center transition cursor-pointer group">
                <div>
                    <h3 class="text-gray-800 font-black text-lg flex items-center gap-2">📅 Lista de Atualização Diária</h3>
                    <p class="text-gray-500 text-xs mt-1">Acompanhe os diários e envie atualizações para aprovação.</p>
                </div>
                <span class="text-gray-300 group-hover:text-gray-500 transition text-xl">&rarr;</span>
            </button>

            <button onclick="window.location.href='listao-geral.html'" class="w-full bg-white border border-gray-200 hover:border-gray-300 hover:shadow-sm text-left p-6 rounded-xl flex justify-between items-center transition cursor-pointer group">
                <div>
                    <h3 class="text-gray-800 font-black text-lg flex items-center gap-2">📊 O Listão Geral</h3>
                    <p class="text-gray-500 text-xs mt-1">Insira os cronogramas semanais nas datas liberadas pela ADM.</p>
                </div>
                <span class="text-gray-300 group-hover:text-gray-500 transition text-xl">&rarr;</span>
            </button>
        </div>

        <!-- CAIXA DE GERENCIAMENTO (DONO E STAFF) -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mt-8">
            <h2 class="text-lg font-black text-gray-800 mb-4 flex items-center gap-2">👑 Minhas Obras (Gerenciamento & Staff)</h2>
            <div class="overflow-y-auto max-h-96 pr-2 space-y-3" id="lista-minhas-obras">
                <p class="text-sm text-gray-500">Buscando suas obras...</p>
            </div>
        </section>

    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = () => {
            const nick = localStorage.getItem('usuario_nick');
            if(!nick) { window.location.href = 'index.html'; return; }
            document.getElementById('saudacao').textContent = `Olá, ${nick}!`;
            
            carregarMinhasObras(nick);
        };

        function sair() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function carregarMinhasObras(meuNick) {
            // 1. Descobre o ID do Mod logado
            const { data: usuario } = await _supabase.from('equipe').select('id').eq('nick', meuNick).single();
            const meuId = usuario ? String(usuario.id) : null;

            // 2. Puxa todas as obras do banco
            const { data: obras, error } = await _supabase.from('obras').select('*').order('nome');
            const container = document.getElementById('lista-minhas-obras');
            container.innerHTML = '';

            if (error || !obras || obras.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-400 italic">Nenhuma obra cadastrada.</p>`;
                return;
            }

            // 3. Filtra apenas as que o Mod é dono OU é staff
            const minhasObras = obras.filter(obra => {
                const souDono = obra.responsavel_nick && obra.responsavel_nick.includes(meuNick);
                const souStaff = obra.staff_ids && meuId && obra.staff_ids.map(String).includes(meuId);
                return souDono || souStaff;
            });

            if (minhasObras.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-400 italic">Você não gerencia e nem está vinculado a nenhuma obra no momento.</p>`;
                return;
            }

            minhasObras.forEach(obra => {
                let corStatus = obra.status === 'Ativa' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600';
                const papel = (obra.responsavel_nick && obra.responsavel_nick.includes(meuNick)) ? '👑 Responsável' : '👥 Staff';

                container.innerHTML += `
                    <div class="p-4 rounded-lg border border-gray-100 hover:bg-gray-50 transition flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-gray-800 flex items-center gap-2">${obra.nome} <span class="text-[10px] text-gray-400 bg-white border border-gray-200 px-1 rounded">${papel}</span></h3>
                            <p class="text-xs text-gray-500 mt-1">Língua: ${obra.lingua || 'Não informada'}</p>
                        </div>
                        <span class="text-xs font-bold px-3 py-1 rounded-full ${corStatus}">${obra.status}</span>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
