<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Central de Layouts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <!-- Barra de Navegação -->
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <img src="MARCA.png" alt="Logo Fleur" class="h-10 object-contain">
            <h1 class="text-xl font-bold text-gray-800 border-l border-gray-300 pl-4">Central de Layouts</h1>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='dashboard-adm.html'" class="text-sm font-bold text-gray-600 hover:text-red-700 transition">&larr; Voltar ao Painel</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 mt-4">
        
        <div class="mb-8">
            <h2 class="text-2xl font-black text-gray-900">Galeria de Artes</h2>
            <p class="text-gray-600 mt-1">Acesse rapidamente todos os layouts para postagem.</p>
        </div>

        <!-- Abas de Navegação -->
        <div class="flex space-x-2 border-b border-gray-200 mb-6">
            <button id="btn-lancamento" onclick="mudarAba('lancamento')" class="px-6 py-3 text-sm font-black border-b-4 border-green-500 text-green-700 bg-green-50 rounded-t-lg transition">
                🟢 Lançamentos
            </button>
            <button id="btn-atualizacao" onclick="mudarAba('atualizacao')" class="px-6 py-3 text-sm font-bold border-b-4 border-transparent text-gray-500 hover:text-blue-700 hover:bg-blue-50 rounded-t-lg transition">
                🔵 Atualizações
            </button>
            <button id="btn-finalizacao" onclick="mudarAba('finalizacao')" class="px-6 py-3 text-sm font-bold border-b-4 border-transparent text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-t-lg transition">
                ⚫ Finalizações
            </button>
        </div>

        <!-- Conteiner de Carregamento -->
        <div id="loading" class="text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-red-700 mx-auto mb-4"></div>
            <p class="text-gray-500 font-bold">Buscando layouts no Supabase...</p>
        </div>

        <!-- Grids de Imagens (Conteúdo das Abas) -->
        <div id="grid-lancamento" class="hidden grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        <div id="grid-atualizacao" class="hidden grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        <div id="grid-finalizacao" class="hidden grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>

    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = carregarLayouts;

        async function carregarLayouts() {
            const { data, error } = await _supabase
                .from('obras')
                .select('nome, layout_lancamento, layout_atualizacao, layout_finalizacao')
                .order('nome');

            document.getElementById('loading').classList.add('hidden');

            if (error || !data) {
                alert("Erro ao carregar os layouts da base de dados.");
                console.error(error);
                return;
            }

            const gridLancamento = document.getElementById('grid-lancamento');
            const gridAtualizacao = document.getElementById('grid-atualizacao');
            const gridFinalizacao = document.getElementById('grid-finalizacao');

            data.forEach(obra => {
                if (obra.layout_lancamento) {
                    gridLancamento.innerHTML += criarCard(obra.nome, obra.layout_lancamento, 'green');
                }
                if (obra.layout_atualizacao) {
                    gridAtualizacao.innerHTML += criarCard(obra.nome, obra.layout_atualizacao, 'blue');
                }
                if (obra.layout_finalizacao) {
                    gridFinalizacao.innerHTML += criarCard(obra.nome, obra.layout_finalizacao, 'gray');
                }
            });

            // Se alguma grid ficar vazia após o carregamento
            if (gridLancamento.innerHTML === '') gridLancamento.innerHTML = '<p class="col-span-full text-gray-500">Nenhum layout de lançamento cadastrado.</p>';
            if (gridAtualizacao.innerHTML === '') gridAtualizacao.innerHTML = '<p class="col-span-full text-gray-500">Nenhum layout de atualização cadastrado.</p>';
            if (gridFinalizacao.innerHTML === '') gridFinalizacao.innerHTML = '<p class="col-span-full text-gray-500">Nenhum layout de finalização cadastrado.</p>';

            // Mostra a aba de lançamentos por padrão
            mudarAba('lancamento');
        }

        function criarCard(nome, url, cor) {
            let corBorda, corTexto;
            if (cor === 'green') { corBorda = 'border-green-200'; corTexto = 'text-green-800'; }
            else if (cor === 'blue') { corBorda = 'border-blue-200'; corTexto = 'text-blue-800'; }
            else { corBorda = 'border-gray-300'; corTexto = 'text-gray-800'; }

            return `
                <div class="bg-white p-3 rounded-xl border ${corBorda} shadow-sm hover:shadow-md transition flex flex-col group">
                    <div class="relative w-full h-48 bg-gray-100 rounded-lg overflow-hidden mb-3 border border-gray-100">
                        <img src="${url}" alt="Layout ${nome}" class="w-full h-full object-cover object-top group-hover:scale-105 transition duration-300">
                        <a href="${url}" target="_blank" class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition backdrop-blur-sm">
                            <span class="bg-white text-gray-900 font-bold text-xs px-3 py-2 rounded-lg">🔎 Ampliar / Salvar</span>
                        </a>
                    </div>
                    <p class="text-sm font-black ${corTexto} text-center line-clamp-2 leading-tight">${nome}</p>
                </div>
            `;
        }

        function mudarAba(aba) {
            // Esconde todas as grids
            document.getElementById('grid-lancamento').classList.add('hidden');
            document.getElementById('grid-atualizacao').classList.add('hidden');
            document.getElementById('grid-finalizacao').classList.add('hidden');

            // Reseta estilo de todos os botões
            const btnLancamento = document.getElementById('btn-lancamento');
            const btnAtualizacao = document.getElementById('btn-atualizacao');
            const btnFinalizacao = document.getElementById('btn-finalizacao');
            
            btnLancamento.className = "px-6 py-3 text-sm font-bold border-b-4 border-transparent text-gray-500 hover:text-green-700 hover:bg-green-50 rounded-t-lg transition";
            btnAtualizacao.className = "px-6 py-3 text-sm font-bold border-b-4 border-transparent text-gray-500 hover:text-blue-700 hover:bg-blue-50 rounded-t-lg transition";
            btnFinalizacao.className = "px-6 py-3 text-sm font-bold border-b-4 border-transparent text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-t-lg transition";

            // Ativa a aba clicada
            if (aba === 'lancamento') {
                document.getElementById('grid-lancamento').classList.remove('hidden');
                btnLancamento.className = "px-6 py-3 text-sm font-black border-b-4 border-green-500 text-green-700 bg-green-50 rounded-t-lg transition";
            } else if (aba === 'atualizacao') {
                document.getElementById('grid-atualizacao').classList.remove('hidden');
                btnAtualizacao.className = "px-6 py-3 text-sm font-black border-b-4 border-blue-500 text-blue-700 bg-blue-50 rounded-t-lg transition";
            } else if (aba === 'finalizacao') {
                document.getElementById('grid-finalizacao').classList.remove('hidden');
                btnFinalizacao.className = "px-6 py-3 text-sm font-black border-b-4 border-gray-600 text-gray-900 bg-gray-200 rounded-t-lg transition";
            }
        }
    </script>
</body>
</html>
