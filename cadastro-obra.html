<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Nova Obra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <img src="MARCA.png" alt="Logo Fleur" class="h-10 object-contain">
            <h1 class="text-xl font-bold text-gray-800 border-l border-gray-300 pl-4">Ficha da Obra</h1>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="voltar()" class="text-sm font-bold text-gray-600 hover:text-red-700 transition">&larr; Voltar</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6 mt-4">
        
        <div class="mb-6">
            <h2 class="text-2xl font-black text-gray-900">Cadastrar Nova Obra</h2>
            <p class="text-gray-600 mt-1">Preencha todos os detalhes exigidos pelo banco de dados para registrar a obra.</p>
        </div>

        <form id="form-cadastro-obra" onsubmit="salvarNovaObra(event)" class="space-y-6">
            
            <!-- 1. INFORMAÇÕES BÁSICAS -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <h3 class="text-lg font-black text-gray-800 border-b border-gray-100 pb-2 mb-4">📖 Informações Básicas</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Nome da Obra</label>
                        <input type="text" id="obra-nome" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Sinopse</label>
                        <textarea id="obra-sinopse" rows="3" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none"></textarea>
                    </div>

                    <div class="md:col-span-2 bg-red-50 p-4 rounded-lg border border-red-100">
                        <label class="block text-xs font-black text-red-800 mb-1">👑 Responsável (Dono da Obra)</label>
                        <select id="obra-responsavel" required class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none">
                            <option value="">Carregando equipe...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Tipo de Obra</label>
                        <select id="obra-tipo" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                            <option value="Recorrente">Recorrente</option>
                            <option value="Curta">Curta</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Nível de Prioridade</label>
                        <select id="obra-prioridade" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                            <option value="Máxima">🔥 Máxima</option>
                            <option value="Alta">⭐ Alta</option>
                            <option value="Média" selected>📄 Média</option>
                            <option value="Baixa">💤 Baixa</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Status da Obra</label>
                        <select id="obra-status" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                            <option value="Ativo">🟢 Ativo (Lançando)</option>
                            <option value="Hiato">🟡 Em Hiato</option>
                            <option value="Concluido">🔴 Concluído</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 2. ARQUIVOS E PLATAFORMA -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <h3 class="text-lg font-black text-gray-800 border-b border-gray-100 pb-2 mb-4">📁 Links e Publicação</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Capa Oficial (Upload de Imagem)</label>
                        <input type="file" id="obra-capa" accept="image/*" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-1.5 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Link da Pasta (Google Drive)</label>
                        <input type="url" id="obra-drive" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="https://drive.google.com/drive/folders/...">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Plataforma Oficial</label>
                        <input type="text" id="obra-plataforma" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Ex: MangaDex">
                    </div>
                </div>
            </div>

            <!-- 3. CRONOGRAMA E CAPÍTULOS (ESTAVA FALTANDO!) -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <h3 class="text-lg font-black text-gray-800 border-b border-gray-100 pb-2 mb-4">⏱️ Cronograma e Progresso</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Dia Oficial de Lançamento</label>
                        <input type="text" id="obra-dia-oficial" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Ex: Segunda-feira">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Dia de Lançamento (Scan)</label>
                        <input type="text" id="obra-dia-scan" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Ex: Quarta-feira">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Último Capítulo na Plataforma Oficial</label>
                        <input type="number" id="obra-capitulo-plat" value="0" min="0" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Último Capítulo na Fleur</label>
                        <input type="number" id="obra-capitulo-fleur" value="0" min="0" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    </div>
                </div>
            </div>

            <!-- 4. LAYOUTS (AGORA COM UPLOAD DE IMAGENS) -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <h3 class="text-lg font-black text-gray-800 border-b border-gray-100 pb-2 mb-4">🎨 Layouts da Obra (Upload)</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Layout de Lançamento</label>
                        <input type="file" id="obra-layout-lancamento" accept="image/*" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-1.5 text-sm file:bg-red-50 file:text-red-700 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Layout de Atualização</label>
                        <input type="file" id="obra-layout-atualizacao" accept="image/*" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-1.5 text-sm file:bg-red-50 file:text-red-700 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Layout de Finalização</label>
                        <input type="file" id="obra-layout-finalizacao" accept="image/*" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-1.5 text-sm file:bg-red-50 file:text-red-700 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- 5. EQUIPE / STAFF VINCULADA -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <h3 class="text-lg font-black text-gray-800 border-b border-gray-100 pb-2 mb-4">👥 Staff Vinculada</h3>
                <div id="lista-membros-staff" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    <p class="text-xs text-gray-500">Carregando membros da equipe...</p>
                </div>
            </div>
            
            <!-- BOTÃO SALVAR -->
            <div class="flex justify-end gap-4">
                <button type="submit" id="btn-salvar" class="bg-red-700 hover:bg-red-800 text-white font-black py-3 px-8 rounded-xl transition text-lg shadow-xl shadow-red-700/30">
                    💾 Salvar Obra Completa
                </button>
            </div>
        </form>
    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async () => {
            try {
                // Puxa id, nick e cargo_sistema
                const { data: equipe, error } = await _supabase.from('equipe').select('id, nick, cargo_sistema');
                
                if (error) throw error;

                const selectResp = document.getElementById('obra-responsavel');
                const containerStaff = document.getElementById('lista-membros-staff');
                
                selectResp.innerHTML = '<option value="">Selecione o Responsável</option>';
                containerStaff.innerHTML = '';

                if (!equipe || equipe.length === 0) {
                    selectResp.innerHTML = '<option value="">Nenhum membro encontrado</option>';
                    containerStaff.innerHTML = '<p class="text-xs text-gray-400">Nenhum membro encontrado.</p>';
                } else {
                    equipe.forEach(l => {
                        selectResp.innerHTML += `<option value="${l.nick}">${l.nick} (${l.cargo_sistema || 'Moderador'})</option>`;
                    });

                    containerStaff.innerHTML = equipe.map(m => `
                        <label class="flex items-center gap-2 p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm cursor-pointer hover:bg-gray-100">
                            <input type="checkbox" name="staff_membros" value="${m.id}" class="rounded text-red-700 focus:ring-red-700">
                            <span class="font-semibold text-gray-800">${m.nick}</span>
                            <span class="text-xs text-gray-500 ml-auto">(${m.cargo_sistema || 'Moderador'})</span>
                        </label>
                    `).join('');
                }
            } catch (err) {
                console.error("Erro ao carregar equipe:", err.message);
                document.getElementById('obra-responsavel').innerHTML = '<option value="">Erro ao carregar dados</option>';
            }
        };

        function voltar() {
            const cargo = localStorage.getItem('usuario_cargo');
            if(cargo === 'Administrador') window.location.href = 'dashboard-adm.html';
            else if(cargo === 'Moderador') window.location.href = 'dashboard-moderador.html';
            else window.location.href = 'index.html';
        }

        async function fazerUpload(inputId, pasta) {
            const input = document.getElementById(inputId);
            if (!input.files || input.files.length === 0) return null;
            
            const file = input.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            const filePath = `${pasta}/${fileName}`;

            const { error: uploadError } = await _supabase.storage.from('fleurflow-bucket').upload(filePath, file);
            if (uploadError) {
                console.error("Erro no upload:", uploadError.message);
                throw new Error(`Erro ao enviar arquivo de ${inputId}: ` + uploadError.message);
            }

            const { data } = _supabase.storage.from('fleurflow-bucket').getPublicUrl(filePath);
            return data.publicUrl;
        }

        async function salvarNovaObra(event) {
            event.preventDefault(); 
            const btn = document.getElementById('btn-salvar');
            btn.disabled = true;
            btn.textContent = 'Enviando imagens e salvando obra...';

            try {
                // Upload das imagens
                const capaUrl = await fazerUpload('obra-capa', 'capas');
                const layoutLanc = await fazerUpload('obra-layout-lancamento', 'layouts');
                const layoutAtu = await fazerUpload('obra-layout-atualizacao', 'layouts');
                const layoutFin = await fazerUpload('obra-layout-finalizacao', 'layouts');

                // Pegar os arrays de checkbox
                const checkboxes = document.querySelectorAll('input[name="staff_membros"]:checked');
                const staff_ids = Array.from(checkboxes).map(cb => cb.value);

                // Montar o objeto com TODAS as 17 colunas
                const dadosObra = {
                    nome: document.getElementById('obra-nome').value,
                    sinopse: document.getElementById('obra-sinopse').value,
                    tipo: document.getElementById('obra-tipo').value,
                    responsavel_nick: document.getElementById('obra-responsavel').value,
                    plataforma_oficial: document.getElementById('obra-plataforma').value,
                    dia_oficial: document.getElementById('obra-dia-oficial').value,
                    dia_scan: document.getElementById('obra-dia-scan').value,
                    prioridade: document.getElementById('obra-prioridade').value,
                    drive_url: document.getElementById('obra-drive').value,
                    capa_url: capaUrl,
                    layout_lancamento: layoutLanc,
                    layout_atualizacao: layoutAtu,
                    layout_finalizacao: layoutFin,
                    capitulo_plataforma: parseInt(document.getElementById('obra-capitulo-plat').value) || 0,
                    capitulo_fleur: parseInt(document.getElementById('obra-capitulo-fleur').value) || 0,
                    status: document.getElementById('obra-status').value,
                    staff_ids: staff_ids
                };

                const { error } = await _supabase.from('obras').insert([dadosObra]);
                
                if (error) throw error;

                alert("Obra e imagens salvas com sucesso!");
                voltar();

            } catch (error) {
                console.error('Erro ao salvar:', error.message);
                alert('Erro ao salvar: ' + error.message);
                btn.disabled = false;
                btn.textContent = '💾 Salvar Obra Completa';
            }
        }
    </script>
</body>
</html>
