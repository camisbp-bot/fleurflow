<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Cadastro de Obra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-10">

    <nav class="bg-red-900 text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-50">
        <h1 class="text-xl font-black tracking-wider">FleurFlow <span class="text-red-300 text-sm font-normal">| Cadastro</span></h1>
        <button onclick="window.history.back()" class="bg-red-800 hover:bg-red-950 text-white text-xs font-bold py-2 px-4 rounded-full transition cursor-pointer">Voltar</button>
    </nav>

    <main class="max-w-4xl mx-auto p-6 mt-6 bg-white rounded-xl shadow-md border border-gray-200">
        <h2 class="text-2xl font-black text-gray-800 mb-6 border-b pb-3" id="titulo-pagina">📖 Nova Obra</h2>

        <form id="form-obra" onsubmit="salvarObra(event)" class="space-y-6">
            <input type="hidden" id="obra-id">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">Nome da Obra</label>
                    <input type="text" id="obra-nome" required class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">Status</label>
                    <select id="obra-status" class="w-full border border-gray-300 rounded p-2 text-sm font-bold bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none">
                        <option value="Ativa">🟢 Ativa</option>
                        <option value="Pausada">🟡 Pausada</option>
                        <option value="Finalizada">🔴 Finalizada</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">Link Oficial (Raws)</label>
                    <input type="url" id="obra-oficial" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">Link na Scan (Site Fleur)</label>
                    <input type="url" id="obra-scan" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">Último Cap Oficial</label>
                    <input type="text" id="obra-cap-oficial" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">Último Cap Fleur</label>
                    <input type="text" id="obra-cap-fleur" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">Último Cap VIP</label>
                    <input type="text" id="obra-cap-vip" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none">
                </div>
            </div>

            <!-- BLOCO DE PRIORIDADE, DIAS E VIEWS -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 p-4 bg-blue-50 border border-blue-200 rounded-lg shadow-inner">
                <div>
                    <label class="text-xs font-black text-blue-900 block mb-1">Prioridade</label>
                    <select id="obra-prioridade" class="w-full border border-blue-300 rounded p-2 text-sm font-bold bg-white text-blue-800 focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
                        <option value="Baixa">💤 Prioridade Baixa</option>
                        <option value="Média">📄 Prioridade Média</option>
                        <option value="Máxima">🔥 Prioridade Máxima</option>
                        <option value="Altíssima">👑 Prioridade Altíssima</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-black text-blue-900 block mb-1">Dias de Atualização</label>
                    <input type="text" id="obra-dias" placeholder="Ex: Segunda-Feira" class="w-full border border-blue-300 rounded p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                
                <!-- AQUI ESTÁ A CAIXA QUE SUMIU! -->
                <div>
                    <label class="text-xs font-black text-blue-900 flex items-center gap-1 mb-1">👁️ Views Totais (No App)</label>
                    <input type="number" id="obra-views" placeholder="Ex: 2222383" class="w-full border border-blue-300 rounded p-2 text-sm font-mono font-bold text-blue-900 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <p class="text-[9px] text-blue-700 mt-1 leading-tight italic">Preencha ao cadastrar. O robô vai calcular o crescimento a partir daqui.</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-amber-50 p-4 border border-amber-200 rounded-lg">
                    <label class="text-xs font-black text-amber-900 mb-2 block">👑 Donos / Responsáveis</label>
                    <input type="text" id="obra-responsavel" list="lista-equipe" placeholder="Digite o nick do moderador..." class="w-full border border-amber-300 rounded p-2 text-sm bg-white focus:ring-2 focus:ring-amber-500 outline-none">
                    <datalist id="lista-equipe"></datalist>
                </div>
                
                <div class="bg-gray-50 p-4 border border-gray-200 rounded-lg">
                    <label class="text-xs font-black text-gray-800 mb-2 block">👥 Equipe (Staff)</label>
                    <div id="container-staff" class="max-h-40 overflow-y-auto space-y-1 bg-white border border-gray-300 p-2 rounded shadow-inner">
                        <p class="text-xs text-gray-400 italic">Carregando equipe...</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 border-t border-gray-200 pt-4 mt-6">
                <button type="button" onclick="window.history.back()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded cursor-pointer transition">Cancelar</button>
                <button type="submit" id="btn-salvar" class="bg-red-700 hover:bg-red-800 text-white font-bold py-2 px-8 rounded shadow cursor-pointer transition">💾 Salvar Obra</button>
            </div>
        </form>
    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async () => {
            const nick = localStorage.getItem('usuario_nick');
            if(!nick) return window.location.href = 'index.html';

            await carregarEquipe();
            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('edit');
            if(editId) carregarDadosEdicao(editId);
        };

        async function carregarEquipe() {
            const { data } = await _supabase.from('equipe').select('id, nick, nome_real').order('nick');
            const datalist = document.getElementById('lista-equipe');
            const contStaff = document.getElementById('container-staff');
            
            if(!data) { contStaff.innerHTML = '<span class="text-xs text-red-500">Erro ao carregar equipe.</span>'; return; }
            
            datalist.innerHTML = ''; contStaff.innerHTML = '';
            data.forEach(m => {
                datalist.innerHTML += `<option value="${m.nick}">`;
                contStaff.innerHTML += `
                    <label class="flex items-center gap-2 cursor-pointer p-1.5 hover:bg-gray-50 rounded transition">
                        <input type="checkbox" name="staff_check" value="${m.id}" class="accent-red-600 w-4 h-4 cursor-pointer">
                        <span class="text-sm font-semibold text-gray-700">${m.nick} <span class="text-[10px] text-gray-400 font-normal">(${m.nome_real || ''})</span></span>
                    </label>
                `;
            });
        }

        async function carregarDadosEdicao(id) {
            document.getElementById('titulo-pagina').innerHTML = '✏️ Editar Obra';
            const { data, error } = await _supabase.from('obras').select('*').eq('id', id).single();
            if(error || !data) { alert("Obra não encontrada."); window.history.back(); return; }

            document.getElementById('obra-id').value = data.id;
            document.getElementById('obra-nome').value = data.nome || '';
            document.getElementById('obra-status').value = data.status || 'Ativa';
            document.getElementById('obra-oficial').value = data.link_oficial || '';
            document.getElementById('obra-scan').value = data.link_scan || '';
            document.getElementById('obra-cap-oficial').value = data.capitulo_plataforma || '';
            document.getElementById('obra-cap-fleur').value = data.capitulo_fleur || '';
            document.getElementById('obra-cap-vip').value = data.capitulo_vip || '';
            document.getElementById('obra-prioridade').value = data.prioridade || 'Baixa';
            document.getElementById('obra-dias').value = data.dias_atualizacao || '';
            document.getElementById('obra-views').value = data.views_totais || '';
            document.getElementById('obra-responsavel').value = data.responsavel_nick || '';

            let staffIds = [];
            if(typeof data.staff_ids === 'string') { 
                try { staffIds = JSON.parse(data.staff_ids); } catch(e) { staffIds = data.staff_ids.split(','); } 
            } else if (Array.isArray(data.staff_ids)) { 
                staffIds = data.staff_ids; 
            }

            document.querySelectorAll('input[name="staff_check"]').forEach(cb => {
                if(staffIds.map(String).includes(String(cb.value))) cb.checked = true;
            });
        }

        async function salvarObra(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar'); 
            btn.innerText = "⏳ Salvando..."; btn.disabled = true;

            const id = document.getElementById('obra-id').value;
            const vTotais = document.getElementById('obra-views').value;
            
            const checkboxes = document.querySelectorAll('input[name="staff_check"]:checked');
            const staffSelecionada = Array.from(checkboxes).map(cb => cb.value);

            const obj = {
                nome: document.getElementById('obra-nome').value,
                status: document.getElementById('obra-status').value,
                link_oficial: document.getElementById('obra-oficial').value,
                link_scan: document.getElementById('obra-scan').value,
                capitulo_plataforma: document.getElementById('obra-cap-oficial').value,
                capitulo_fleur: document.getElementById('obra-cap-fleur').value,
                capitulo_vip: document.getElementById('obra-cap-vip').value,
                prioridade: document.getElementById('obra-prioridade').value,
                dias_atualizacao: document.getElementById('obra-dias').value,
                responsavel_nick: document.getElementById('obra-responsavel').value,
                staff_ids: JSON.stringify(staffSelecionada)
            };

            if (vTotais) obj.views_totais = parseInt(vTotais);

            let req;
            if(id) { 
                req = await _supabase.from('obras').update(obj).eq('id', id); 
            } else { 
                req = await _supabase.from('obras').insert([obj]); 
            }

            if (req.error) { 
                alert("🚨 Erro ao salvar: " + req.error.message); 
                btn.innerText = "💾 Salvar Obra"; btn.disabled = false; 
            } else { 
                alert("✅ Obra salva com sucesso!"); 
                window.history.back(); 
            }
        }
    </script>
</body>
</html>
