<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Nova Obra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <img src="MARCA.png" alt="Logo Fleur" class="h-10 object-contain">
            <h1 class="text-xl font-bold text-gray-800 border-l border-gray-300 pl-4">Ficha da Obra</h1>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="voltar()" class="text-sm font-bold text-gray-600 hover:text-red-700 transition">&larr; Voltar</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6 mt-4">
        
        <div class="mb-6">
            <h2 class="text-2xl font-black text-gray-900">Cadastrar Nova Obra</h2>
            <p class="text-gray-600 mt-1">Preencha os detalhes, escolha o Responsável e vincule a equipe.</p>
        </div>

        <form id="form-cadastro-obra" onsubmit="salvarNovaObra(event)" class="space-y-6">
            
            <!-- INFORMAÇÕES BÁSICAS -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <h3 class="text-lg font-black text-gray-800 border-b border-gray-100 pb-2 mb-4">📖 Informações Básicas</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Nome da Obra</label>
                        <input type="text" id="obra-nome" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Sinopse</label>
                        <textarea id="obra-sinopse" rows="3" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none"></textarea>
                    </div>

                    <!-- NOVO: RESPONSÁVEL (ADM/MOD) -->
                    <div class="md:col-span-2 bg-red-50 p-4 rounded-lg border border-red-100">
                        <label class="block text-xs font-black text-red-800 mb-1">👑 ADM / Moderador Responsável (Dono da Obra)</label>
                        <select id="obra-responsavel" required class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none">
                            <option value="">Carregando líderes...</option>
                        </select>
                    </div>

                    <!-- CAPA -->
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Capa Oficial (Upload)</label>
                        <input type="file" id="obra-capa" accept="image/*" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-1.5 text-sm file:bg-red-50 file:text-red-700">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Link da Pasta (Google Drive)</label>
                        <input type="url" id="obra-drive" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Tipo de Obra</label>
                        <select id="obra-tipo" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                            <option value="Recorrente">Recorrente</option>
                            <option value="Curta">Curta</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Nível de Prioridade</label>
                        <select id="obra-prioridade" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                            <option value="Máxima">🔥 Máxima</option>
                            <option value="Alta">⭐ Alta</option>
                            <option value="Média" selected>📄 Média</option>
                            <option value="Baixa">💤 Baixa</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Demais seções continuam iguais: Plataforma, Layouts e Equipe -->
            <!-- ... Cole aqui as divs de "Publicação", "Layouts" e "Staff Vinculada" que já tínhamos ... -->
            
            <div class="flex justify-end">
                <button type="submit" class="bg-red-700 hover:bg-red-800 text-white font-black py-3 px-8 rounded-xl transition text-lg shadow-xl shadow-red-700/30">
                    💾 Salvar Obra Completa
                </button>
            </div>
        </form>
    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async () => {
            // Carrega quem é ADM ou MOD para o select
            const selectResp = document.getElementById('obra-responsavel');
            const { data: lideres } = await _supabase.from('equipe').select('nick, cargo_sistema').in('cargo_sistema', ['Administrador', 'Moderador']);
            
            selectResp.innerHTML = '<option value="">Selecione o Responsável</option>';
            if(lideres) lideres.forEach(l => selectResp.innerHTML += `<option value="${l.nick}">${l.nick} (${l.cargo_sistema})</option>`);
            
            // ... Mantenha aqui a sua função de carregarEquipe() que lista os checkboxes ...
        };

        function voltar() {
            const cargo = localStorage.getItem('usuario_cargo');
            if(cargo === 'Administrador') window.location.href = 'dashboard-adm.html';
            else if(cargo === 'Moderador') window.location.href = 'dashboard-moderador.html';
            else window.location.href = 'login.html';
        }

        async function salvarNovaObra(event) {
            event.preventDefault();
            const responsavelNick = document.getElementById('obra-responsavel').value;
            // ... (resto do seu código de salvar, garantindo que envia responsavel_nick para a tabela) ...
            alert("Obra salva!");
            voltar();
        }
    </script>
</body>
</html>
