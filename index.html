<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-sm md:max-w-md rounded-2xl shadow-xl overflow-hidden p-8">
        
        <!-- LOGO E TÍTULO -->
        <div class="text-center mb-6">
            <img src="MARCA.png" alt="Logo Fleur Blanche" class="h-16 mx-auto object-contain mb-3">
            <p class="text-sm font-semibold text-gray-600">Gerenciamento de Produção - FleurFlow</p>
        </div>

        <!-- ABAS (ENTRAR E CADASTRAR STAFF) -->
        <div class="flex border-b border-gray-200 mb-6">
            <button class="flex-1 text-center py-2 text-sm font-bold text-red-700 border-b-2 border-red-700">
                Entrar
            </button>
            <button onclick="window.location.href='cadastro-staff.html'" class="flex-1 text-center py-2 text-sm font-semibold text-gray-400 hover:text-gray-600 hover:bg-gray-50 border-b-2 border-transparent transition cursor-pointer">
                Cadastrar Staff
            </button>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form onsubmit="fazerLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Nick ou E-mail</label>
                <input type="text" id="login-identificador" required placeholder="Ex: Camis" class="w-full bg-blue-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Senha</label>
                <input type="password" id="login-senha" required placeholder="••••••••" class="w-full bg-white border border-red-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-700">
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-lg text-sm shadow-md transition cursor-pointer">
                    Entrar no Sistema
                </button>
            </div>
        </form>
    </div>

   <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fazerLogin(event) {
            event.preventDefault();

            const identificador = document.getElementById('login-identificador').value.trim();
            const senha = document.getElementById('login-senha').value.trim();

            try {
                // 1. Busca TODOS os membros para ignorar qualquer problema de pesquisa do banco
                const { data: equipe, error } = await _supabase
                    .from('equipe')
                    .select('*');

                // TESTE A: Ver se o Supabase deixou ler a tabela
                if (error) {
                    alert('Erro de permissão no Supabase: ' + error.message);
                    return;
                }

                // TESTE B: Ver se a tabela veio vazia (Significa que o RLS está bloqueando)
                if (!equipe || equipe.length === 0) {
                    alert('Nenhum usuário retornou! O Supabase está bloqueando a leitura.\n\nVá no Supabase > Table Editor > equipe > Desative o RLS (Disable RLS).');
                    return;
                }

                // 2. Procura o usuário que você digitou na lista que voltou
                const usuario = equipe.find(u => 
                    (u.nick && u.nick.toLowerCase() === identificador.toLowerCase()) || 
                    (u.email && u.email.toLowerCase() === identificador.toLowerCase())
                );

                // TESTE C: Ver se achou o Nick
                if (!usuario) {
                    alert(`O Nick "${identificador}" não foi encontrado na tabela da equipe.`);
                    return;
                }

                // TESTE D: Compara a senha e mostra exatamente o que tem lá!
                if (usuario.senha !== senha) {
                    alert(`SENHA INCORRETA!\n\nVocê digitou: [${senha}]\nNo banco de dados está salvo: [${usuario.senha}]\n\nVeja se tem algum espaço a mais sobrando no banco!`);
                    return;
                }

                // SE PASSAR POR TUDO, FAZ O LOGIN:
                localStorage.setItem('usuario_nick', usuario.nick);
                localStorage.setItem('usuario_cargo', usuario.cargo_sistema);
                localStorage.setItem('usuario_id', usuario.id);

                alert(`Bem-vinda, ${usuario.nick}!`);

                // REDIRECIONA PARA A TELA CERTA
                if (usuario.cargo_sistema === 'Administrador') {
                    window.location.href = 'dashboard-adm.html';
                } 
                else if (usuario.cargo_sistema === 'Moderador') {
                    window.location.href = 'dashboard-moderador.html';
                } 
                else {
                    window.location.href = 'dashboard-staff.html';
                }

            } catch (err) {
                alert('Erro no script: ' + err.message);
            }
        }
    </script>
</body>
</html>
