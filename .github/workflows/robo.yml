name: 🤖 Robô de Views Automático

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sincronizar_views:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Pegando os arquivos do painel
        uses: actions/checkout@v4

      - name: ⚙️ Configurando o cérebro (Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Instalando ferramentas
        run: npm install @supabase/supabase-js cheerio

      - name: 🚀 Acordando o Robô Sincronizador!
        run: node scripts/robo_views.js
