<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Cadastro de Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 border border-gray-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-gray-800">✨ Novo Membro da Staff</h1>
            <p class="text-xs text-gray-500 mt-1">Cadastre seus dados para acessar o sistema da scan.</p>
        </div>

        <form onsubmit="cadastrarStaff(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Nick (Nome na Scan)</label>
                <input type="text" id="staff-nick" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none" placeholder="Ex: Kamiz">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">E-mail</label>
                <input type="email" id="staff-email" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none" placeholder="seu@email.com">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Senha de Acesso</label>
                <input type="password" id="staff-senha" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none" placeholder="••••••••">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Cargo no Sistema</label>
                <select id="staff-cargo" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    <option value="Moderador">Moderador</option>
                    <option value="Administrador">Administrador</option>
                    <option value="Staff">Staff</option>
                </select>
            </div>

            <button type="submit" id="btn-cadastrar" class="w-full bg-red-700 hover:bg-red-800 text-white font-black py-3 rounded-xl transition text-sm shadow-lg shadow-red-700/30 cursor-pointer mt-2">
                Cadastrar Membro
            </button>
        </form>

        <div class="text-center mt-6">
            <button onclick="window.location.href='index.html'" class="text-xs font-bold text-gray-600 hover:text-red-700 cursor-pointer">&larr; Voltar para o Login</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cadastrarStaff(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-cadastrar');
            btn.disabled = true;
            btn.textContent = 'Cadastrando...';

            const nick = document.getElementById('staff-nick').value;
            const email = document.getElementById('staff-email').value;
            const senha = document.getElementById('staff-senha').value;
            const cargo = document.getElementById('staff-cargo').value;

            try {
                const { error } = await _supabase.from('equipe').insert([{
                    nick: nick,
                    email: email,
                    senha: senha,
                    cargo_sistema: cargo
                }]);

                if (error) throw error;

                alert('Cadastro realizado com sucesso! Faça login para continuar.');
                window.location.href = 'index.html';

            } catch (err) {
                alert('Erro ao cadastrar: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Cadastrar Membro';
            }
        }
    </script>
</body>
</html>
