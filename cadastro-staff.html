<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Cadastro de Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-8 border border-gray-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-gray-800">✨ Novo Membro da Staff</h1>
            <p class="text-xs text-gray-500 mt-1">Preencha todos os dados para registrar o membro no sistema.</p>
        </div>

        <form onsubmit="cadastrarStaff(event)" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nome Completo</label>
                    <input type="text" id="staff-nome" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nick (Nome na Scan)</label>
                    <input type="text" id="staff-nick" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Data de Nascimento</label>
                    <input type="date" id="staff-nascimento" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Telefone / WhatsApp</label>
                    <input type="text" id="staff-telefone" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">E-mail</label>
                <input type="email" id="staff-email" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Senha de Acesso</label>
                <input type="password" id="staff-senha" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-700 focus:outline-none">
            </div>

            <!-- CHECKBOXES COM AS 5 FUNÇÕES -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-2">Funções na Scan</label>
                <div class="grid grid-cols-2 gap-2 p-3 bg-gray-50 rounded-lg border border-gray-300">
                    <label class="flex items-center gap-2 text-xs font-semibold text-gray-700 cursor-pointer">
                        <input type="checkbox" name="funcao" value="Organizer" class="rounded text-red-700"> Organizer
                    </label>
                    <label class="flex items-center gap-2 text-xs font-semibold text-gray-700 cursor-pointer">
                        <input type="checkbox" name="funcao" value="Tradutor" class="rounded text-red-700"> Tradutor
                    </label>
                    <label class="flex items-center gap-2 text-xs font-semibold text-gray-700 cursor-pointer">
                        <input type="checkbox" name="funcao" value="Revisor" class="rounded text-red-700"> Revisor
                    </label>
                    <label class="flex items-center gap-2 text-xs font-semibold text-gray-700 cursor-pointer">
                        <input type="checkbox" name="funcao" value="Cleaner" class="rounded text-red-700"> Cleaner
                    </label>
                    <label class="flex items-center gap-2 text-xs font-semibold text-gray-700 cursor-pointer">
                        <input type="checkbox" name="funcao" value="Editor" class="rounded text-red-700"> Editor
                    </label>
                </div>
            </div>

            <button type="submit" id="btn-cadastrar" class="w-full bg-red-700 hover:bg-red-800 text-white font-black py-3 rounded-xl transition text-sm shadow-lg shadow-red-700/30 cursor-pointer mt-4">
                Cadastrar Membro
            </button>
        </form>

        <div class="text-center mt-6">
            <button onclick="window.location.href='index.html'" class="text-xs font-bold text-gray-600 hover:text-red-700 cursor-pointer">&larr; Voltar para o Login</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cadastrarStaff(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-cadastrar');
            
            const checkboxes = document.querySelectorAll('input[name="funcao"]:checked');
            const funcoesArray = Array.from(checkboxes).map(cb => cb.value);
            const funcoesString = funcoesArray.join(', ');

            btn.disabled = true;
            btn.textContent = 'Cadastrando...';

            try {
                const dadosMembro = {
                    nome: document.getElementById('staff-nome').value,
                    nick: document.getElementById('staff-nick').value,
                    data_nascimento: document.getElementById('staff-nascimento').value || null,
                    telefone: document.getElementById('staff-telefone').value,
                    email: document.getElementById('staff-email').value,
                    senha: document.getElementById('staff-senha').value,
                    cargo_sistema: 'Staff', 
                    funcoes: funcoesString
                };

                const { error } = await _supabase.from('equipe').insert([dadosMembro]);

                if (error) throw error;

                alert('Cadastro realizado com sucesso!');
                window.location.href = 'index.html';

            } catch (err) {
                alert('Erro ao cadastrar: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Cadastrar Membro';
            }
        }
    </script>
</body>
</html>
