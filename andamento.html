<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Andamento da Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <h1 class="text-xl font-bold text-gray-800">⚙️ Divisão de Tarefas & Andamento</h1>
        <button onclick="voltar()" class="text-sm font-bold text-gray-600 hover:text-red-700 cursor-pointer">&larr; Voltar ao Painel</button>
    </nav>

    <main class="max-w-6xl mx-auto p-6 mt-4 space-y-6">
        
        <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
            <h2 class="text-lg font-black text-gray-900 mb-4 flex items-center gap-2">🧩 Painel de Divisão de Tarefas</h2>
            
            <div class="bg-blue-50 border border-blue-200 p-5 rounded-xl mb-6 shadow-sm">
                <label class="block text-sm font-black text-blue-900 mb-1">1º Passo: Selecione a Obra</label>
                <p class="text-xs text-blue-700 mb-3">O sistema carregará automaticamente apenas a equipe que foi vinculada a este projeto.</p>
                <select id="tarefa-obra" onchange="aoSelecionarObra()" class="w-full bg-white border border-blue-300 rounded-lg px-3 py-2 text-sm font-semibold text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                    <option value="">Aguarde, carregando obras...</option>
                </select>
            </div>

            <!-- 2º PASSO: ATRIBUIR TAREFAS (COM DATA E HORA!) -->
            <form id="form-tarefa" onsubmit="adicionarTarefa(event)" class="hidden bg-gray-50 border border-gray-200 p-5 rounded-xl shadow-inner">
                <h3 class="text-sm font-black text-gray-800 border-b border-gray-200 pb-2 mb-4">2º Passo: Atribuir Etapas e Prazos</h3>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 items-end">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Capítulo(s)</label>
                        <input type="text" id="tarefa-capitulo" placeholder="Ex: 15" required class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Etapa / Função</label>
                        <select id="tarefa-etapa" required class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                            <option value="Tradução">Tradução</option>
                            <option value="Revisão">Revisão</option>
                            <option value="Clean">Clean</option>
                            <option value="Redraw">Redraw</option>
                            <option value="Typeset">Typeset</option>
                            <option value="Quality Check">Quality Check</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-red-700 mb-1">Responsável</label>
                        <select id="tarefa-responsavel" required class="w-full bg-white border border-red-300 rounded-lg px-3 py-2 text-sm font-semibold text-gray-800 focus:ring-2 focus:ring-red-500 focus:outline-none cursor-pointer">
                        </select>
                    </div>

                    <!-- CAMPO ATUALIZADO: DATA E HORA -->
                    <div>
                        <label class="block text-xs font-bold text-red-700 mb-1">Prazo (Data e Hora)</label>
                        <input type="datetime-local" id="tarefa-prazo" required class="w-full bg-white border border-red-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none cursor-pointer">
                    </div>

                    <div>
                        <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-2 rounded-lg text-sm shadow cursor-pointer transition">
                            ➕ Atribuir Tarefa
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-black text-gray-800">📋 Controle de Entregas Pendentes</h3>
                <button onclick="carregarTarefas()" class="text-xs font-bold text-blue-600 hover:underline">🔄 Atualizar Lista</button>
            </div>

            <div class="overflow-x-auto p-4">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="text-xs uppercase font-black text-gray-400 border-b border-gray-200">
                        <tr>
                            <th class="px-4 py-3">Prazo</th>
                            <th class="px-4 py-3">Obra & Cap</th>
                            <th class="px-4 py-3">Etapa</th>
                            <th class="px-4 py-3">Responsável</th>
                            <th class="px-4 py-3">Status</th>
                            <th class="px-4 py-3 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-tarefas" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let todasObras = [];
        let todaEquipe = [];

        window.onload = async () => {
            const cargo = localStorage.getItem('usuario_cargo');
            if (cargo !== 'Administrador' && cargo !== 'Moderador') {
                window.location.href = 'index.html';
                return;
            }
            await carregarDadosIniciais();
            await carregarTarefas();
        };

        function voltar() {
            const cargo = localStorage.getItem('usuario_cargo');
            if (cargo === 'Administrador') window.location.href = 'dashboard-adm.html';
            else window.location.href = 'dashboard-moderador.html';
        }

        async function carregarDadosIniciais() {
            try {
                const { data: obras } = await _supabase.from('obras').select('id, nome, staff_ids, responsavel_nick').order('nome');
                todasObras = obras || [];
                const { data: equipe } = await _supabase.from('equipe').select('id, nick, cargo_sistema').order('nick');
                todaEquipe = equipe || [];

                const selectObra = document.getElementById('tarefa-obra');
                selectObra.innerHTML = '<option value="">👇 Clique aqui e selecione a obra...</option>';
                todasObras.forEach(o => selectObra.innerHTML += `<option value="${o.nome}">${o.nome}</option>`);
            } catch (err) { console.error("Erro:", err); }
        }

        function aoSelecionarObra() {
            const nomeObra = document.getElementById('tarefa-obra').value;
            const painelDivisao = document.getElementById('form-tarefa');
            const selectResp = document.getElementById('tarefa-responsavel');

            if (!nomeObra) { painelDivisao.classList.add('hidden'); return; }

            const obra = todasObras.find(o => o.nome === nomeObra);
            if (obra) {
                const staffIds = (obra.staff_ids || []).map(String);
                const donos = obra.responsavel_nick ? obra.responsavel_nick.split(', ') : [];
                const equipeObra = todaEquipe.filter(m => staffIds.includes(String(m.id)) || donos.includes(m.nick));

                selectResp.innerHTML = '<option value="">Selecione quem vai fazer...</option>';
                if (equipeObra.length === 0) selectResp.innerHTML = '<option value="">⚠️ Ninguém foi vinculado!</option>';
                else equipeObra.forEach(m => selectResp.innerHTML += `<option value="${m.nick}">${m.nick} (${m.cargo_sistema || 'Staff'})</option>`);
                
                painelDivisao.classList.remove('hidden');
            }
        }

        async function adicionarTarefa(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            
            const responsavel = document.getElementById('tarefa-responsavel').value;
            if(!responsavel) return alert("Selecione um responsável válido!");

            btn.disabled = true;
            btn.textContent = 'Adicionando...';

            const obj = {
                obra_nome: document.getElementById('tarefa-obra').value,
                capitulo: document.getElementById('tarefa-capitulo').value,
                etapa: document.getElementById('tarefa-etapa').value,
                responsavel_nick: responsavel,
                prazo: document.getElementById('tarefa-prazo').value, // Envia a Data + Hora
                status: 'Pendente'
            };

            const { error } = await _supabase.from('tarefas').insert([obj]);

            if (error) { alert('Erro: ' + error.message); } 
            else {
                document.getElementById('tarefa-capitulo').value = '';
                document.getElementById('tarefa-prazo').value = '';
                carregarTarefas();
            }

            btn.disabled = false;
            btn.textContent = '➕ Atribuir Tarefa';
        }

        async function carregarTarefas() {
            const tb = document.getElementById('tabela-tarefas');
            tb.innerHTML = '<tr><td colspan="6" class="px-4 py-4 text-center text-gray-400 text-xs">Carregando andamento...</td></tr>';

            const { data, error } = await _supabase.from('tarefas').select('*').order('prazo', { ascending: true });

            if (error) { tb.innerHTML = `<tr><td colspan="6" class="text-red-500 text-center py-4">${error.message}</td></tr>`; return; }

            tb.innerHTML = '';
            const pendentes = data.filter(t => t.status !== 'Concluído');

            if (pendentes.length === 0) { tb.innerHTML = `<tr><td colspan="6" class="text-gray-400 text-center py-8">Nenhuma tarefa pendente! 🎉</td></tr>`; return; }

            const agora = new Date();

            pendentes.forEach(t => {
                let corStatus = t.status === 'Em Andamento' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700';
                
                // Formata DATA E HORA
                let dataFormatada = 'Sem prazo';
                let corPrazo = 'text-gray-500';
                
                if (t.prazo) {
                    const dataPrazo = new Date(t.prazo);
                    dataFormatada = dataPrazo.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                    
                    if (dataPrazo < agora) {
                        corPrazo = 'text-red-600 font-black bg-red-100 px-2 py-0.5 rounded'; // Atrasado
                    } else if (dataPrazo.toDateString() === agora.toDateString()) {
                        corPrazo = 'text-orange-600 font-bold'; // Prazo hoje
                    } else {
                        corPrazo = 'text-green-600 font-semibold'; // No prazo
                    }
                }

                tb.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 text-sm ${corPrazo}">${dataFormatada}</td>
                        <td class="px-4 py-3"><span class="font-bold text-gray-800">${t.obra_nome}</span> <span class="font-semibold text-red-700 ml-1">C.${t.capitulo}</span></td>
                        <td class="px-4 py-3 text-xs uppercase font-bold text-gray-500">${t.etapa}</td>
                        <td class="px-4 py-3 text-sm text-gray-700">👤 ${t.responsavel_nick}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 rounded text-[10px] font-black uppercase ${corStatus}">
                                ${t.status || 'Pendente'}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-right space-x-2">
                            <button onclick="mudarStatus('${t.id}', 'Concluído')" class="text-green-600 font-bold text-xs hover:underline">✅ Concluir</button>
                            <button onclick="excluirTarefa('${t.id}')" class="text-red-500 font-bold text-xs hover:underline">🗑️ Excluir</button>
                        </td>
                    </tr>`;
            });
        }

        async function mudarStatus(id, novoStatus) {
            const { error } = await _supabase.from('tarefas').update({ status: novoStatus }).eq('id', id);
            if(error) alert("Erro: " + error.message); else carregarTarefas();
        }

        async function excluirTarefa(id) {
            if(confirm("Deseja apagar essa tarefa?")) {
                const { error } = await _supabase.from('tarefas').delete().eq('id', id);
                if(!error) carregarTarefas();
            }
        }
    </script>
</body>
</html>
