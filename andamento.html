<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Andamento da Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <h1 class="text-xl font-bold text-gray-800">⚙️ Andamento das Obras (Staff)</h1>
        <button onclick="voltar()" class="text-sm font-bold text-gray-600 hover:text-red-700 cursor-pointer">&larr; Voltar ao Painel</button>
    </nav>

    <main class="max-w-6xl mx-auto p-6 mt-4 space-y-6">
        
        <!-- NOVA TAREFA -->
        <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
            <h2 class="text-lg font-black text-gray-900 mb-4">➕ Atribuir Nova Tarefa / Capítulo</h2>
            
            <form id="form-tarefa" onsubmit="adicionarTarefa(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 items-end">
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Obra</label>
                    <select id="tarefa-obra" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="">Carregando...</option>
                    </select>
                </div>
                
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Capítulo</label>
                    <input type="text" id="tarefa-capitulo" placeholder="Ex: 15" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                </div>

                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Etapa / Função</label>
                    <select id="tarefa-etapa" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="Tradução">Tradução</option>
                        <option value="Revisão">Revisão</option>
                        <option value="Clean">Clean</option>
                        <option value="Redraw">Redraw</option>
                        <option value="Typeset">Typeset</option>
                        <option value="Quality Check">Quality Check</option>
                    </select>
                </div>

                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Responsável (Staff)</label>
                    <select id="tarefa-responsavel" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="">Carregando...</option>
                    </select>
                </div>

                <div class="md:col-span-1">
                    <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-2 rounded-lg text-sm shadow cursor-pointer transition">
                        Atribuir Tarefa
                    </button>
                </div>
            </form>
        </div>

        <!-- LISTA DE TAREFAS -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-black text-gray-800">📋 Controle de Entregas Pendentes</h3>
                <button onclick="carregarTarefas()" class="text-xs font-bold text-blue-600 hover:underline">🔄 Atualizar Lista</button>
            </div>

            <div class="overflow-x-auto p-4">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="text-xs uppercase font-black text-gray-400 border-b border-gray-200">
                        <tr>
                            <th class="px-4 py-3">Obra</th>
                            <th class="px-4 py-3">Capítulo</th>
                            <th class="px-4 py-3">Etapa</th>
                            <th class="px-4 py-3">Responsável</th>
                            <th class="px-4 py-3">Status</th>
                            <th class="px-4 py-3 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-tarefas" class="divide-y divide-gray-100">
                        <!-- Tarefas vão aparecer aqui -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async () => {
            // TRAVA DE SEGURANÇA: Só passa se for ADM ou Moderador
            const cargo = localStorage.getItem('usuario_cargo');
            if (cargo !== 'Administrador' && cargo !== 'Moderador') {
                window.location.href = 'index.html';
                return;
            }

            await carregarObrasSelect();
            await carregarEquipe();
            await carregarTarefas();
        };

        // Botão de Voltar Mágico
        function voltar() {
            const cargo = localStorage.getItem('usuario_cargo');
            if (cargo === 'Administrador') {
                window.location.href = 'dashboard-adm.html';
            } else {
                window.location.href = 'dashboard-moderador.html';
            }
        }

        async function carregarObrasSelect() {
            const { data } = await _supabase.from('obras').select('nome').order('nome');
            const select = document.getElementById('tarefa-obra');
            select.innerHTML = '<option value="">Selecione...</option>';
            if(data) data.forEach(o => select.innerHTML += `<option value="${o.nome}">${o.nome}</option>`);
        }

        async function carregarEquipe() {
            const { data } = await _supabase.from('equipe').select('nick').order('nick');
            const select = document.getElementById('tarefa-responsavel');
            select.innerHTML = '<option value="">Selecione...</option>';
            if(data) data.forEach(m => select.innerHTML += `<option value="${m.nick}">${m.nick}</option>`);
        }

        async function adicionarTarefa(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Adicionando...';

            const obj = {
                obra_nome: document.getElementById('tarefa-obra').value,
                capitulo: document.getElementById('tarefa-capitulo').value,
                etapa: document.getElementById('tarefa-etapa').value,
                responsavel_nick: document.getElementById('tarefa-responsavel').value,
                status: 'Pendente'
            };

            // Vai inserir na tabela "tarefas"
            const { error } = await _supabase.from('tarefas').insert([obj]);

            if (error) {
                alert('Erro ao atribuir tarefa: ' + error.message);
                console.error(error);
            } else {
                document.getElementById('tarefa-capitulo').value = '';
                carregarTarefas();
            }

            btn.disabled = false;
            btn.textContent = 'Atribuir Tarefa';
        }

        async function carregarTarefas() {
            const tb = document.getElementById('tabela-tarefas');
            tb.innerHTML = '<tr><td colspan="6" class="px-4 py-4 text-center text-gray-400 text-xs">Carregando andamento...</td></tr>';

            // Puxa as tarefas pendentes
            const { data, error } = await _supabase.from('tarefas').select('*').order('created_at', { ascending: false });

            if (error) {
                tb.innerHTML = `<tr><td colspan="6" class="px-4 py-4 text-center text-red-500 text-xs">Erro: ${error.message}</td></tr>`;
                return;
            }

            tb.innerHTML = '';
            
            const tarefasPendentes = data.filter(t => t.status !== 'Concluído');

            if (tarefasPendentes.length === 0) {
                tb.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-gray-400 text-sm">Nenhuma tarefa pendente no momento! 🎉</td></tr>`;
                return;
            }

            tarefasPendentes.forEach(t => {
                let corStatus = t.status === 'Em Andamento' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700';
                
                tb.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 font-bold text-gray-800">${t.obra_nome}</td>
                        <td class="px-4 py-3 font-semibold text-red-700">Cap. ${t.capitulo}</td>
                        <td class="px-4 py-3 text-xs uppercase font-bold text-gray-500">${t.etapa}</td>
                        <td class="px-4 py-3 text-sm text-gray-700">👤 ${t.responsavel_nick}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 rounded text-[10px] font-black uppercase ${corStatus}">
                                ${t.status || 'Pendente'}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-right space-x-2">
                            <button onclick="mudarStatus('${t.id}', 'Concluído')" class="text-green-600 font-bold text-xs hover:underline">✅ Concluir</button>
                            <button onclick="excluirTarefa('${t.id}')" class="text-red-500 font-bold text-xs hover:underline">🗑️ Excluir</button>
                        </td>
                    </tr>`;
            });
        }

        async function mudarStatus(id, novoStatus) {
            const { error } = await _supabase.from('tarefas').update({ status: novoStatus }).eq('id', id);
            if(error) alert("Erro ao atualizar: " + error.message);
            else carregarTarefas();
        }

        async function excluirTarefa(id) {
            if(confirm("Tem certeza que deseja apagar essa tarefa?")) {
                const { error } = await _supabase.from('tarefas').delete().eq('id', id);
                if(error) alert("Erro ao excluir: " + error.message);
                else carregarTarefas();
            }
        }
    </script>
</body>
</html>
