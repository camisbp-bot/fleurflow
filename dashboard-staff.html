<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Painel da Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-10">

    <nav class="bg-red-900 text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-black tracking-wider">FleurFlow <span class="text-red-300 text-sm font-normal">| Painel da Staff</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <span id="saudacao" class="text-sm font-semibold text-red-100 hidden sm:block">Olá, Staff! 🌸</span>
            <button onclick="sair()" class="bg-red-800 hover:bg-red-950 text-white text-xs font-bold py-2 px-4 rounded-full transition cursor-pointer">Sair</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 mt-4 space-y-8">

        <section class="bg-white rounded-xl shadow-sm border border-pink-200 p-6 flex flex-col h-[400px]">
            <h2 class="text-lg font-black text-pink-900 mb-2 flex items-center gap-2">💖 Obras que Faço Parte</h2>
            <p class="text-[10px] text-gray-500 mb-4">Clique em uma obra para ver as suas tarefas.</p>
            <div class="overflow-y-auto flex-1 pr-2 space-y-3" id="lista-obras-staff">
                <p class="text-sm text-gray-400 italic">Buscando suas obras...</p>
            </div>
        </section>

        <!-- A ORDEM CORRETA: Concluídas, Atrasadas, Hoje, Ativas -->
        <section id="painel-tarefas" class="hidden bg-white p-6 rounded-xl shadow-md border border-gray-300 transition-all">
            <div class="flex justify-between items-center mb-6 border-b border-gray-200 pb-3">
                <h2 id="titulo-painel-tarefas" class="text-xl font-black text-gray-800 flex items-center gap-2">📋 Minhas Tarefas</h2>
                <div class="flex gap-3">
                    <a id="btn-drive-obra" href="#" target="_blank" class="hidden text-xs font-bold bg-gray-900 hover:bg-black text-white px-3 py-1.5 rounded transition cursor-pointer">📁 Acessar Drive</a>
                    <button onclick="fecharPainelTarefas()" class="text-xs font-bold bg-gray-100 hover:bg-red-100 hover:text-red-700 text-gray-600 px-3 py-1.5 rounded transition cursor-pointer">✖ Fechar Painel</button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- 1º CONCLUÍDAS -->
                <div class="bg-white rounded-xl shadow-sm border border-green-200 flex flex-col h-80">
                    <div class="bg-green-50 p-3 border-b border-green-100 rounded-t-xl"><h3 class="font-black text-green-800 text-sm">✅ Entregas Concluídas</h3></div>
                    <div class="overflow-y-auto flex-1 p-3 space-y-3" id="detalhe-concluidas"></div>
                </div>
                <!-- 2º ATRASADAS -->
                <div class="bg-white rounded-xl shadow-sm border border-red-200 flex flex-col h-80">
                    <div class="bg-red-50 p-3 border-b border-red-100 rounded-t-xl"><h3 class="font-black text-red-800 text-sm">🚨 Entregas Atrasadas</h3></div>
                    <div class="overflow-y-auto flex-1 p-3 space-y-3" id="detalhe-atraso"></div>
                </div>
                <!-- 3º HOJE -->
                <div class="bg-white rounded-xl shadow-sm border border-orange-200 flex flex-col h-80">
                    <div class="bg-orange-50 p-3 border-b border-orange-100 rounded-t-xl"><h3 class="font-black text-orange-800 text-sm">🗓️ Entregas para Hoje</h3></div>
                    <div class="overflow-y-auto flex-1 p-3 space-y-3" id="detalhe-hoje"></div>
                </div>
                <!-- 4º ATIVAS -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-80">
                    <div class="bg-gray-50 p-3 border-b border-gray-200 rounded-t-xl"><h3 class="font-black text-gray-800 text-sm">📋 Entregas Ativas</h3></div>
                    <div class="overflow-y-auto flex-1 p-3 space-y-3" id="detalhe-ativas"></div>
                </div>
            </div>
        </section>

    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let todasTarefasGlobais = [];
        let todasObrasGlobais = [];
        let obraAbertaAtual = null;

        window.onload = () => {
            const nick = localStorage.getItem('usuario_nick');
            if(!nick) { window.location.href = 'index.html'; return; }
            document.getElementById('saudacao').textContent = `Olá, ${nick}! 🌸`;
            carregarTudo(nick);
        };

        function sair() { localStorage.clear(); window.location.href = 'index.html'; }

        async function carregarTudo(meuNick) {
            const { data: usuario } = await _supabase.from('equipe').select('id').eq('nick', meuNick).single();
            const meuId = usuario ? String(usuario.id) : null;
            const { data: obras } = await _supabase.from('obras').select('*').order('nome');
            todasObrasGlobais = obras || [];
            const { data: tarefas } = await _supabase.from('tarefas').select('*').neq('status', 'Arquivado').order('prazo', { ascending: true });
            todasTarefasGlobais = tarefas || [];

            const minhasObras = [];
            if (obras) {
                obras.forEach(o => {
                    const souStaff = o.staff_ids && meuId && o.staff_ids.map(String).includes(meuId);
                    if (souStaff) minhasObras.push(o);
                });
            }
            renderizarObrasStaff(minhasObras);
            if (obraAbertaAtual) abrirTarefasObra(obraAbertaAtual);
        }

        function renderizarObrasStaff(listaObras) {
            const container = document.getElementById('lista-obras-staff');
            container.innerHTML = '';
            if (listaObras.length === 0) { container.innerHTML = `<p class="text-sm text-gray-400 italic">Você não foi vinculado(a) a nenhuma obra.</p>`; return; }

            listaObras.forEach(obra => {
                let corStatus = obra.status === 'Ativa' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600';
                const nomeSeguro = obra.nome.replace(/'/g, "\\'");

                container.innerHTML += `
                    <div onclick="abrirTarefasObra('${nomeSeguro}')" class="p-3 rounded-lg border border-gray-200 hover:border-pink-400 hover:bg-pink-50 transition flex justify-between items-center bg-white shadow-sm cursor-pointer group">
                        <div>
                            <h3 class="font-bold text-gray-800 flex items-center gap-2 text-sm group-hover:text-pink-900 transition">${obra.nome}</h3>
                            <p class="text-[10px] text-gray-500 mt-1">Língua: ${obra.lingua || 'N/A'}</p>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${corStatus}">${obra.status}</span>
                    </div>
                `;
            });
        }

        function abrirTarefasObra(obraNome) {
            obraAbertaAtual = obraNome;
            const painel = document.getElementById('painel-tarefas');
            const titulo = document.getElementById('titulo-painel-tarefas');
            const meuNick = localStorage.getItem('usuario_nick');
            const btnDrive = document.getElementById('btn-drive-obra');
            
            const obraInfo = todasObrasGlobais.find(o => o.nome === obraNome);
            if (obraInfo && obraInfo.drive_url) { btnDrive.href = obraInfo.drive_url; btnDrive.classList.remove('hidden'); } 
            else { btnDrive.classList.add('hidden'); }

            const tarefasFiltradas = todasTarefasGlobais.filter(t => t.obra_nome === obraNome && t.responsavel_nick === meuNick);
            titulo.innerHTML = `📝 Minhas Tarefas (STAFF) <span class="text-gray-400 text-sm font-normal mx-2">👉</span> <span class="text-pink-700">${obraNome}</span>`;

            renderizarPainel(tarefasFiltradas);
            painel.classList.remove('hidden');
            painel.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function fecharPainelTarefas() { document.getElementById('painel-tarefas').classList.add('hidden'); obraAbertaAtual = null; }

        function renderizarPainel(lista) {
            const containerAtraso = document.getElementById('detalhe-atraso');
            const containerHoje = document.getElementById('detalhe-hoje');
            const containerAtivas = document.getElementById('detalhe-ativas');
            const containerConcluidas = document.getElementById('detalhe-concluidas');

            containerAtraso.innerHTML = ''; containerHoje.innerHTML = ''; containerAtivas.innerHTML = ''; containerConcluidas.innerHTML = '';
            
            if (lista.length === 0) {
                const msgVazio = `<div class="text-center py-4"><p class="text-xs text-gray-400">Nenhuma tarefa.</p></div>`;
                containerAtraso.innerHTML = msgVazio; containerHoje.innerHTML = msgVazio; containerAtivas.innerHTML = msgVazio; containerConcluidas.innerHTML = msgVazio; return;
            }

            const agora = new Date(); const hojeStr = agora.toDateString();
            let cAtraso=0, cHoje=0, cAtiva=0, cConc=0;

            lista.forEach(t => {
                let isConcluida = t.status === 'Concluído';
                let corStatus = t.status === 'Em Andamento' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-700';
                if(isConcluida) corStatus = 'bg-green-100 text-green-700';

                let botaoAcao = '';
                if (t.status === 'Pendente') botaoAcao = `<button onclick="mudarStatusTarefa('${t.id}', 'Em Andamento')" class="text-[10px] bg-blue-600 hover:bg-blue-700 text-white font-bold px-2 py-1.5 rounded w-full mt-2 transition">▶️ Iniciar</button>`;
                else if (t.status === 'Em Andamento') botaoAcao = `<button onclick="mudarStatusTarefa('${t.id}', 'Concluído')" class="text-[10px] bg-green-600 hover:bg-green-700 text-white font-bold px-2 py-1.5 rounded w-full mt-2 transition">✅ Entregar</button>`;
                else if (t.status === 'Concluído') botaoAcao = `<button disabled class="text-[10px] bg-gray-200 text-gray-400 font-bold px-2 py-1.5 rounded w-full mt-2 cursor-not-allowed">⏳ Aguardando Revisão</button>`;

                let prazoFormatado = '';
                if (t.prazo) { const d = new Date(t.prazo); prazoFormatado = `Prazo: ${d.toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute:'2-digit'})}`; }

                const cardHTML = `
                    <div class="bg-white border border-gray-100 p-3 rounded shadow-sm hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold text-red-700 text-sm leading-tight">C.${t.capitulo}</span>
                            <span class="text-[10px] font-bold text-gray-600 bg-gray-100 px-1.5 py-0.5 rounded">PG: ${t.paginas || 'Todas'}</span>
                        </div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] uppercase font-black text-gray-500">${t.etapa}</span>
                            <span class="px-1 py-0.5 rounded text-[9px] font-bold ${corStatus}">${t.status}</span>
                        </div>
                        ${t.prazo ? `<p class="text-[10px] font-bold text-gray-600 bg-gray-50 px-2 py-1 rounded inline-block mt-1">${prazoFormatado}</p>` : ''}
                        ${botaoAcao}
                    </div>
                `;

                if (isConcluida) { containerConcluidas.innerHTML += cardHTML; cConc++; }
                else if (!t.prazo) { containerAtivas.innerHTML += cardHTML; cAtiva++; }
                else {
                    const dataPrazo = new Date(t.prazo);
                    if (dataPrazo < agora) { containerAtraso.innerHTML += cardHTML; cAtraso++; } 
                    else if (dataPrazo.toDateString() === hojeStr) { containerHoje.innerHTML += cardHTML; cHoje++; } 
                    else { containerAtivas.innerHTML += cardHTML; cAtiva++; }
                }
            });

            const msgVazio = `<div class="text-center py-4"><p class="text-xs text-gray-400">Tudo limpo!</p></div>`;
            if(!cAtraso) containerAtraso.innerHTML = msgVazio; if(!cHoje) containerHoje.innerHTML = msgVazio; 
            if(!cAtiva) containerAtivas.innerHTML = msgVazio; if(!cConc) containerConcluidas.innerHTML = msgVazio;
        }

        async function mudarStatusTarefa(id, novoStatus) {
            const btn = event.target; const textOriginal = btn.innerHTML; btn.innerHTML = '⏳'; btn.disabled = true;
            const { error } = await _supabase.from('tarefas').update({ status: novoStatus }).eq('id', id);
            if(error) { alert("Erro: " + error.message); btn.innerHTML = textOriginal; btn.disabled = false; } 
            else { carregarTudo(localStorage.getItem('usuario_nick')); }
        }
    </script>
</body>
</html>
