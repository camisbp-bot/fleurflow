<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Área da Equipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <!-- Barra de Navegação -->
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <img src="MARCA.png" alt="Logo Fleur" class="h-10 object-contain">
            <h1 class="text-xl font-bold text-gray-800 border-l border-gray-300 pl-4">Área da Equipe</h1>
        </div>
        <div class="flex items-center gap-4">
            <span id="nome-usuario" class="text-sm font-bold text-gray-600 bg-gray-100 px-3 py-1 rounded-full border border-gray-200">Membro da Staff</span>
            <button onclick="sair()" class="text-sm font-bold text-red-700 hover:underline">Sair</button>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="max-w-6xl mx-auto p-6 mt-4 space-y-10">
        
        <!-- Saudação -->
        <div>
            <h2 id="saudacao" class="text-2xl font-black text-gray-900">Olá, bem-vindo(a) de volta! 🌸</h2>
            <p class="text-gray-600 mt-1">Verifique suas tarefas ativas e acesse os materiais das suas obras abaixo.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- COLUNA ESQUERDA: MINHAS TAREFAS ATIVAS -->
            <div class="lg:col-span-2 space-y-4">
                <h3 class="text-lg font-black text-gray-800 border-b border-gray-200 pb-2">📝 Minhas Tarefas Ativas</h3>
                
                <div id="lista-tarefas" class="space-y-4">
                    <p class="text-sm text-gray-500 bg-white p-4 rounded-xl border border-gray-200">Carregando suas tarefas...</p>
                </div>
            </div>

            <!-- COLUNA DIREITA: OBRAS QUE FAÇO PARTE -->
            <div class="space-y-4">
                <h3 class="text-lg font-black text-gray-800 border-b border-gray-200 pb-2">📚 Obras que Faço Parte</h3>
                
                <div id="lista-minhas-obras" class="space-y-4">
                    <p class="text-sm text-gray-500 bg-white p-4 rounded-xl border border-gray-200">Carregando suas obras...</p>
                </div>
            </div>

        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = () => {
            const nick = localStorage.getItem('usuario_nick');
            const id = localStorage.getItem('usuario_id');
            
            if (!id) {
                window.location.href = 'login.html'; // Expulsa se não estiver logado
                return;
            }

            document.getElementById('nome-usuario').innerText = nick;
            document.getElementById('saudacao').innerText = `Olá, ${nick}! 🌸`;
            
            carregarMinhasTarefas(nick);
            carregarMinhasObras(id);
        };

        // Carrega as tarefas atribuídas a este nick específico
        async function carregarMinhasTarefas(nickUsuario) {
            const container = document.getElementById('lista-tarefas');
            
            const { data, error } = await _supabase
                .from('tarefas')
                .select('*')
                .eq('responsavel_nick', nickUsuario)
                .order('prazo', { ascending: true });

            if (error) {
                container.innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar tarefas.</p>';
                return;
            }

            // Filtra apenas as pendentes/atrasadas para o topo, ou mostra tudo
            const tarefasAtivas = data.filter(t => t.status !== 'Concluído');

            if (tarefasAtivas.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm bg-white p-4 rounded-xl border border-gray-200">Você não tem nenhuma tarefa pendente no momento. Bom trabalho! 🎉</p>';
                return;
            }

            container.innerHTML = '';

            const agora = new Date();

            tarefasAtivas.forEach(tarefa => {
                const prazoData = new Date(tarefa.prazo);
                let statusAtual = tarefa.status;
                if (agora > prazoData && statusAtual !== 'Concluído') {
                    statusAtual = 'Atrasado';
                }

                const dataFmt = prazoData.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                const horaFmt = prazoData.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                const card = `
                    <div class="bg-white border ${statusAtual === 'Atrasado' ? 'border-red-400 bg-red-50' : 'border-red-200'} rounded-xl p-5 shadow-sm border-l-4 border-l-red-600">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h4 class="text-lg font-black text-gray-900">${tarefa.obra_nome} - Cap. ${tarefa.capitulo}</h4>
                                <p class="text-sm font-bold text-red-700 mt-1">Função: ${tarefa.funcao} <span class="text-gray-500 font-normal">(${tarefa.paginas})</span></p>
                            </div>
                            <div class="text-right">
                                <span class="text-xs font-bold ${statusAtual === 'Atrasado' ? 'bg-red-600 text-white' : 'bg-red-100 text-red-800'} px-3 py-1 rounded-full">
                                    ${statusAtual === 'Atrasado' ? '🚨 Atrasado' : `Prazo: ${dataFmt} às ${horaFmt}`}
                                </span>
                            </div>
                        </div>
                        
                        <div class="flex justify-end mt-4">
                            <button onclick="entregarTarefa('${tarefa.id}', '${tarefa.obra_nome}', '${tarefa.funcao}')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition text-sm flex items-center gap-2">
                                ✅ Marcar como Concluído
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // Função que muda o status para Concluído e notifica opcionalmente via WhatsApp
        async function entregarTarefa(idTarefa, obraNome, funcao) {
            if (!confirm('Deseja realmente marcar esta tarefa como entregue?')) return;

            const { error } = await _supabase
                .from('tarefas')
                .update({ status: 'Concluído' })
                .eq('id', idTarefa);

            if (error) {
                alert("Erro ao enviar entrega: " + error.message);
            } else {
                alert("Tarefa entregue com sucesso! O status foi atualizado para Concluído.");
                
                // Opcional: Abre o WhatsApp com a mensagem pronta para avisar a moderação
                const msg = `Oie! A staff ${localStorage.getItem('usuario_nick')} acabou de entregar a tarefa de ${funcao} na obra ${funcao === 'Edição' ? obraNome : obraNome}. Tudo pronto para conferir! 🌸`;
                window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');

                location.reload(); // Recarrega a página
            }
        }

        // Carrega as obras fixas do usuário
        async function carregarMinhasObras(usuarioId) {
            const container = document.getElementById('lista-minhas-obras');
            
            const { data, error } = await _supabase.from('obras').select('*');
            
            if (error) {
                container.innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar obras.</p>';
                return;
            }

            const minhasObras = data.filter(obra => obra.staff_ids && obra.staff_ids.includes(usuarioId));

            if (minhasObras.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm bg-white p-4 rounded-xl border border-gray-200">Você ainda não foi vinculado(a) a nenhuma obra fixa.</p>';
                return;
            }

            container.innerHTML = '';

            minhasObras.forEach(obra => {
                const capaImg = obra.capa_url ? obra.capa_url : 'https://via.placeholder.com/150x200?text=Sem+Capa';
                const linkDrive = obra.drive_url ? obra.drive_url : '#';
                
                const card = `
                    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
                        <div class="h-32 bg-gray-200 relative overflow-hidden">
                            <img src="${capaImg}" alt="Capa ${obra.nome}" class="w-full h-full object-cover object-center opacity-90 hover:opacity-100 transition">
                            <div class="absolute bottom-2 right-2">
                                <span class="bg-black/70 text-white text-[10px] font-bold px-2 py-1 rounded backdrop-blur-sm">${obra.plataforma_oficial || 'Oficial'}</span>
                            </div>
                        </div>
                        <div class="p-4 flex-1 flex flex-col">
                            <h4 class="text-md font-black text-gray-900 line-clamp-1 mb-1">${obra.nome}</h4>
                            <p class="text-xs text-gray-600 line-clamp-3 mb-3 flex-1">${obra.sinopse || 'Sem sinopse cadastrada.'}</p>
                            
                            <a href="${linkDrive}" target="_blank" class="block w-full text-center bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-xs py-2 rounded-lg border border-gray-300 transition">
                                📁 Abrir Pasta no Drive
                            </a>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function sair() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
