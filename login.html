<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Acesso</title>
    <!-- Tailwind CSS para estilização rápida e bonita -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex items-center justify-center p-4">

    <!-- Container Principal com fundo branco -->
    <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl p-8 shadow-xl">
        
        <!-- Logo / Título -->
        <div class="text-center mb-8">
            <img src="MARCA.png" alt="Logo Fleur Blanche" class="mx-auto h-24 object-contain mb-2">
            <p class="text-sm text-gray-500 font-medium mt-2">Gerenciamento de Produção - FleurFlow</p>
        </div>

        <!-- Abas de Alternância (Login / Cadastro) -->
        <div class="flex border-b border-gray-200 mb-6">
            <button id="tab-login" onclick="alternarAba('login')" class="flex-1 pb-3 text-sm font-bold border-b-2 border-red-700 text-red-700 transition">Entrar</button>
            <button id="tab-cadastro" onclick="alternarAba('cadastro')" class="flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition">Cadastrar Staff</button>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="form-login" onsubmit="realizarLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Nick ou E-mail</label>
                <input type="text" id="login-identificador" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent" placeholder="Ex: Cams ou seu@email.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Senha</label>
                <input type="password" id="login-senha" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-2.5 rounded-lg transition shadow-lg shadow-red-700/30">Entrar no Sistema</button>
        </form>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form id="form-cadastro" onsubmit="realizarCadastro(event)" class="space-y-4 hidden">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nick</label>
                    <input type="text" id="cad-nick" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent" placeholder="Ex: Cams">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nome Completo</label>
                    <input type="text" id="cad-nome" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent" placeholder="Seu nome">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">E-mail</label>
                <input type="email" id="cad-email" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent" placeholder="seu@email.com">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Telefone / WhatsApp</label>
                    <input type="text" id="cad-telefone" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent" placeholder="(00) 00000-0000">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Data de Nascimento</label>
                    <input type="date" id="cad-nascimento" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-2">Funções (Selecione uma ou mais)</label>
                <div class="grid grid-cols-2 gap-2 text-sm bg-gray-50 p-3 border border-gray-200 rounded-lg">
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" name="funcao" value="Organizer" class="rounded border-gray-300 text-red-700 focus:ring-red-700"> <span class="text-gray-700 font-medium">Organizer</span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" name="funcao" value="Cleaner" class="rounded border-gray-300 text-red-700 focus:ring-red-700"> <span class="text-gray-700 font-medium">Cleaner</span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" name="funcao" value="Tradutor" class="rounded border-gray-300 text-red-700 focus:ring-red-700"> <span class="text-gray-700 font-medium">Tradutor</span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" name="funcao" value="Revisor" class="rounded border-gray-300 text-red-700 focus:ring-red-700"> <span class="text-gray-700 font-medium">Revisor</span></label>
                    <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" name="funcao" value="Editor" class="rounded border-gray-300 text-red-700 focus:ring-red-700"> <span class="text-gray-700 font-medium">Editor</span></label>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Senha</label>
                <input type="password" id="cad-senha" required class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-700 focus:border-transparent" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-2.5 rounded-lg transition shadow-lg shadow-red-700/30">Criar Cadastro</button>
        </form>
    </div>

    <!-- Script de Integração com o Supabase -->
    <script>
        // Suas chaves configuradas
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function alternarAba(tipo) {
            const btnLogin = document.getElementById('tab-login');
            const btnCadastro = document.getElementById('tab-cadastro');
            const formLogin = document.getElementById('form-login');
            const formCadastro = document.getElementById('form-cadastro');

            if (tipo === 'login') {
                btnLogin.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-red-700 text-red-700 transition";
                btnCadastro.className = "flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition";
                formLogin.classList.remove('hidden');
                formCadastro.classList.add('hidden');
            } else {
                btnCadastro.className = "flex-1 pb-3 text-sm font-bold border-b-2 border-red-700 text-red-700 transition";
                btnLogin.className = "flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-800 transition";
                formCadastro.classList.remove('hidden');
                formLogin.classList.add('hidden');
            }
        }

        async function realizarCadastro(event) {
            event.preventDefault();
            
            const nick = document.getElementById('cad-nick').value;
            const nome = document.getElementById('cad-nome').value;
            const email = document.getElementById('cad-email').value;
            const telefone = document.getElementById('cad-telefone').value;
            const nascimento = document.getElementById('cad-nascimento').value;
            const senha = document.getElementById('cad-senha').value;

            const checkboxes = document.querySelectorAll('input[name="funcao"]:checked');
            const funcoes = Array.from(checkboxes).map(cb => cb.value);

            if (funcoes.length === 0) {
                alert('Selecione pelo menos uma função!');
                return;
            }

            const { data, error } = await _supabase
                .from('equipe')
                .insert([
                    { 
                        nick, 
                        nome, 
                        email, 
                        telefone, 
                        data_nascimento: nascimento, 
                        funcoes, 
                        senha,
                        cargo_sistema: 'Staff' // Define como Staff automaticamente
                    }
                ]);

            if (error) {
                alert('Erro ao cadastrar: ' + error.message);
                console.error(error);
            } else {
                alert('Cadastro realizado com sucesso! Faça login agora.');
                alternarAba('login');
                document.getElementById('form-cadastro').reset();
            }
        }

        async function realizarLogin(event) {
            event.preventDefault();
            const identificador = document.getElementById('login-identificador').value;
            const senha = document.getElementById('login-senha').value;

            const { data, error } = await _supabase
                .from('equipe')
                .select('*')
                .or(`nick.eq.${identificador},email.eq.${identificador}`)
                .eq('senha', senha)
                .single();

            if (error || !data) {
                alert('Nick/E-mail ou senha incorretos!');
                console.error(error);
            } else {
                // 1. SALVA A HIERARQUIA E QUEM É O USUÁRIO NA MEMÓRIA DO NAVEGADOR
                localStorage.setItem('usuario_nick', data.nick);
                localStorage.setItem('usuario_cargo', data.cargo_sistema);
                localStorage.setItem('usuario_id', data.id);

                alert(`Bem-vindo(a) de volta, ${data.nick}!`);

                // 2. REDIRECIONAMENTO COM BASE NOS 3 DEGRAUS
                if (data.cargo_sistema === 'Administrador') {
                    window.location.href = 'dashboard-adm.html';
                } 
                else if (data.cargo_sistema === 'Moderador') {
                    window.location.href = 'dashboard-adm.html';
                } 
                else {
                    // STAFF (Organizers, Cleaners, Tradutores, Editores, Revisores)
                    window.location.href = 'dashboard-staff.html';
                }
            }
        }
    </script>
</body>
</html>
