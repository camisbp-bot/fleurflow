<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>FleurFlow - Listão Mensal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-50 text-gray-900 pb-20">

    <nav class="bg-red-900 text-white px-6 py-4 shadow-lg mb-8">
        <h1 class="text-2xl font-black">📅 LISTÃO MENSAL</h1>
    </nav>

    <main class="max-w-6xl mx-auto px-4">
        
        <!-- VISÃO DIVIDIDA -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- COLUNA RECORRENTES -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-black text-blue-800 mb-4 flex items-center gap-2">🔄 Obras Recorrentes</h2>
                <div id="lista-recorrentes" class="space-y-3">
                    <!-- Cards preenchidos via JS -->
                </div>
            </section>

            <!-- COLUNA CURTAS -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-black text-green-800 mb-4 flex items-center gap-2">✨ Obras Curtas</h2>
                <div id="lista-curtas" class="space-y-3">
                    <!-- Cards preenchidos via JS -->
                </div>
            </section>
        </div>

        <div class="mt-10 flex justify-center">
             <button onclick="salvarListao()" class="bg-red-700 text-white font-black py-4 px-10 rounded-full shadow-xl hover:bg-red-800 transition">
                 💾 Finalizar Preenchimento do Listão
             </button>
        </div>
    </main>

    <script>
        // Lógica: 
        // 1. Puxa obras da tabela 'obras' (onde tipo = Recorrente ou Curta)
        // 2. Renderiza campos de input (para o preenchimento antecipado)
        // 3. Ao clicar em salvar, grava em 'listao_preenchimento'
        
        async function carregarObrasParaListao() {
            const { data } = await _supabase.from('obras').select('nome, tipo');
            
            const contRecorrentes = document.getElementById('lista-recorrentes');
            const contCurtas = document.getElementById('lista-curtas');

            data.forEach(obra => {
                const html = `
                    <div class="flex items-center gap-2 bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <span class="text-sm font-bold w-1/3 truncate">${obra.nome}</span>
                        <input type="text" placeholder="Capítulos..." class="w-1/3 text-xs border rounded p-1">
                        <input type="text" placeholder="Resp." class="w-1/3 text-xs border rounded p-1">
                    </div>
                `;
                
                if(obra.tipo === 'Recorrente') contRecorrentes.innerHTML += html;
                else contCurtas.innerHTML += html;
            });
        }
    </script>
</body>
</html>
