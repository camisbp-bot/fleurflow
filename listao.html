<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - O Listão Geral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <h1 class="text-xl font-bold text-gray-800">📊 O Listão Geral de Lançamentos</h1>
        <button onclick="window.history.back()" class="text-sm font-bold text-gray-600 hover:text-red-700">&larr; Voltar</button>
    </nav>

    <main class="max-w-6xl mx-auto p-6 mt-4 space-y-6">
        
        <!-- SEÇÃO EXCLUSIVA PARA ADM -->
        <div id="secao-adm-liberacao" class="hidden bg-red-50 rounded-xl p-6 shadow-sm border border-red-200">
            <h2 class="text-lg font-black text-red-900 mb-2">👑 Área da ADM: Liberar Data</h2>
            <form onsubmit="liberarData(event)" class="flex flex-col sm:flex-row gap-4 items-end">
                <div class="flex-1 w-full">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Data</label>
                    <input type="date" id="data-liberada" required class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <button type="submit" class="bg-red-700 hover:bg-red-800 text-white font-bold py-2.5 px-6 rounded-lg text-sm">Liberar</button>
            </form>
        </div>

        <!-- FORMULÁRIO DE LANÇAMENTO -->
        <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
            <h2 class="text-lg font-black text-gray-800 mb-4 border-b border-gray-100 pb-2">✍️ Lançar no Listão</h2>
            
            <form id="form-preenchimento-listao" onsubmit="lancarNoListao(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Data</label>
                    <select id="select-data-liberada" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Obra</label>
                    <select id="select-obra" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Tipo</label>
                    <select id="select-tipo" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="Recorrente">Recorrente</option>
                        <option value="Curta">Curta</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Capítulos</label>
                    <input type="text" id="input-caps" placeholder="Ex: 10 ao 12" required class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm">
                </div>
                <div class="sm:col-span-4 flex justify-end">
                    <button type="submit" class="bg-gray-900 hover:bg-black text-white font-bold py-2 px-6 rounded-lg text-sm">
                        + Adicionar ao Listão
                    </button>
                </div>
            </form>
        </div>

        <!-- TABELA DO LISTÃO -->
        <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200 overflow-x-auto">
            <h3 class="text-lg font-black text-gray-800 mb-4 border-b border-gray-100 pb-2">📋 Programação Atual</h3>
            <table class="w-full text-left border-collapse min-w-max">
                <thead>
                    <tr class="bg-gray-100 text-gray-700 text-xs uppercase tracking-wider border-b border-gray-300">
                        <th class="p-3">Data</th>
                        <th class="p-3">Obra</th>
                        <th class="p-3">Tipo</th>
                        <th class="p-3">Capítulos</th>
                        <th class="p-3">Staff</th>
                        <th class="p-3 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-listao" class="divide-y divide-gray-100 text-sm">
                    <tr><td colspan="6" class="p-4 text-center text-gray-500">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://sqdgafisdbjotyzlhhsj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZGdhZmlzZGJqb3R5emxoaHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzMzMDgsImV4cCI6MjEwMTQ0OTMwOH0.H6tPKPFZ0XsuQed3vL2wLi5--nZyB17YQiZ2jd4Yvt0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async () => {
            verificarPermissaoAdm();
            carregarDatasLiberadas();
            carregarObras();
            carregarListaoPreenchido();
        };

        function verificarPermissaoAdm() {
            if (localStorage.getItem('usuario_cargo') === 'Administrador') {
                document.getElementById('secao-adm-liberacao').classList.remove('hidden');
            }
        }

        async function liberarData(event) {
            event.preventDefault();
            const { error } = await _supabase.from('listao_config').insert([{ data_liberada: document.getElementById('data-liberada').value }]);
            if (error) alert(error.message); else { alert('Data liberada!'); carregarDatasLiberadas(); }
        }

        async function carregarDatasLiberadas() {
            const { data } = await _supabase.from('listao_config').select('*').order('data_liberada');
            const select = document.getElementById('select-data-liberada');
            select.innerHTML = '<option value="">Selecione...</option>';
            if (data) data.forEach(item => select.innerHTML += `<option value="${item.data_liberada}">${new Date(item.data_liberada + 'T00:00:00').toLocaleDateString('pt-BR')}</option>`);
        }

        async function carregarObras() {
            const { data } = await _supabase.from('obras').select('nome').order('nome');
            const select = document.getElementById('select-obra');
            select.innerHTML = '<option value="">Selecione...</option>';
            if (data) data.forEach(o => select.innerHTML += `<option value="${o.nome}">${o.nome}</option>`);
        }

        async function lancarNoListao(event) {
            event.preventDefault();
            const { error } = await _supabase.from('listao_preenchimento').insert([{
                data_postagem: document.getElementById('select-data-liberada').value,
                obra_nome: document.getElementById('select-obra').value,
                tipo_obra: document.getElementById('select-tipo').value, // <--- Ajustado para tipo_obra
                capitulos: document.getElementById('input-caps').value,
                responsavel: localStorage.getItem('usuario_nick') || 'Staff'
            }]);
            if (error) alert('Erro: ' + error.message); else { alert('Lançado!'); carregarListaoPreenchido(); }
        }

        async function carregarListaoPreenchido() {
            const { data } = await _supabase.from('listao_preenchimento').select('*').order('data_postagem');
            const tbody = document.getElementById('tabela-listao');
            if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center">Vazio.</td></tr>'; return; }
            tbody.innerHTML = data.map(item => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3">${new Date(item.data_postagem + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
                    <td class="p-3 font-bold">${item.obra_nome}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded bg-gray-100 text-xs font-bold">${item.tipo_obra || '-'}</span></td>
                    <td class="p-3 text-red-700">${item.capitulos}</td>
                    <td class="p-3 text-gray-500">${item.responsavel}</td>
                    <td class="p-3 text-center"><button onclick="deletar('${item.id}')" class="text-red-500 font-bold">X</button></td>
                </tr>
            `).join('');
        }

        async function deletar(id) {
            await _supabase.from('listao_preenchimento').delete().eq('id', id);
            carregarListaoPreenchido();
        }
    </script>
</body>
</html>
