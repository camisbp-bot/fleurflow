<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - O Listão Geral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <img src="MARCA.png" alt="Logo Fleur" class="h-10 object-contain">
            <h1 class="text-xl font-bold text-gray-800 border-l border-gray-300 pl-4">O Listão Geral</h1>
        </div>
        <div>
            <button onclick="voltar()" class="text-sm font-bold text-gray-600 hover:text-red-700 transition">&larr; Voltar</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 mt-4 space-y-6">
        <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b border-gray-100 pb-2">📊 Listagem Completa de Obras</h2>
            
            <div id="tabela-listao" class="overflow-x-auto">
                <p class="text-gray-500 text-sm">Carregando dados do listão...</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI';
        const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY_AQUI';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function voltar() {
            window.history.back();
        }

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const { data, error } = await supabaseClient.from('obras').select('*');
                const container = document.getElementById('tabela-listao');

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-sm">Nenhum registro encontrado no listão.</p>';
                    return;
                }

                container.innerHTML = `
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-200 text-gray-600 text-sm">
                                <th class="p-3">Obra</th>
                                <th class="p-3">Responsável</th>
                                <th class="p-3">Descrição</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 text-sm">
                            ${data.map(item => `
                                <tr class="hover:bg-gray-50">
                                    <td class="p-3 font-semibold text-gray-800">${item.nome}</td>
                                    <td class="p-3 text-gray-600">${item.responsavel || '-'}</td>
                                    <td class="p-3 text-gray-500">${item.descricao || '-'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                console.error("Erro ao carregar listão:", err.message);
                document.getElementById('tabela-listao').innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar o listão de obras.</p>';
            }
        });
    </script>
</body>
</html>
