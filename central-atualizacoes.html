<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleurFlow - Lista de Atualização Diária</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-10">

    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <img src="MARCA.png" alt="Logo Fleur" class="h-10 object-contain">
            <h1 class="text-xl font-bold text-gray-800 border-l border-gray-300 pl-4">Atualização Diária</h1>
        </div>
        <div>
            <button onclick="voltar()" class="text-sm font-bold text-gray-600 hover:text-red-700 transition">&larr; Voltar</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6 mt-4 space-y-6">
        <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b border-gray-100 pb-2">📅 Diário de Obras e Atualizações</h2>
            
            <div id="lista-atualizacoes" class="space-y-4">
                <p class="text-gray-500 text-sm">Carregando atualizações diárias...</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI';
        const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY_AQUI';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function voltar() {
            window.history.back();
        }

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                // Supondo que sua tabela de atualizações diárias se chame 'atualizacoes' ou 'diario'
                const { data, error } = await supabaseClient.from('atualizacoes').select('*').order('created_at', { ascending: false });
                const container = document.getElementById('lista-atualizacoes');

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-sm">Nenhuma atualização registrada hoje.</p>';
                    return;
                }

                container.innerHTML = data.map(item => `
                    <div class="p-4 bg-gray-50 rounded-lg border border-gray-200">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-gray-800">${item.obra_nome || 'Obra'}</span>
                            <span class="text-xs text-gray-400">${new Date(item.created_at).toLocaleDateString('pt-BR')}</span>
                        </div>
                        <p class="text-sm text-gray-600">${item.descricao || item.texto || ''}</p>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Erro ao carregar atualizações:", err.message);
                document.getElementById('lista-atualizacoes').innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar as atualizações diárias.</p>';
            }
        });
    </script>
</body>
</html>
